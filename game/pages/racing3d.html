<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#4A3F6B">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Мала тркачица 3Д</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏎️</text></svg>">
    <link rel="stylesheet" href="../styles/viewport.css">
    <link rel="stylesheet" href="../styles/design-tokens.css">
    <link rel="stylesheet" href="../shared/accessibility.css">
    <link rel="stylesheet" href="../styles/components.css">
    <style>
        @font-face {
            font-family: 'Fredoka';
            font-style: normal;
            font-weight: 100 700;
            font-display: swap;
            src: url('../assets/fonts/fredoka-latin.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
            font-family: 'Fredoka';
            font-style: normal;
            font-weight: 100 700;
            font-display: swap;
            src: url('../assets/fonts/fredoka-latin-ext.woff2') format('woff2');
            unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Fredoka', 'Comic Sans MS', cursive, sans-serif; }
        #r3d-game { position: fixed; inset: 0; overflow: hidden; background: #87CEEB; }
        #r3d-view { position: absolute; inset: 0; }
        #r3d-view canvas { width: 100%; height: 100%; display: block; }
        /* --- HUD --- */
        .r3d-pill {
            position: absolute; z-index: 10; pointer-events: none;
            background: #FFF8ED; color: #4A3F6B; font-weight: 700;
            padding: 8px 16px; border-radius: 14px; border: 4px solid #FFD23F;
            box-shadow: 0 5px 0 rgba(0,0,0,0.25); text-align: center;
        }
        #r3d-score { top: 12px; left: 16px; font-size: 18px; }
        #r3d-flowers { top: 62px; left: 16px; font-size: 15px; }
        #r3d-world { top: 12px; right: 16px; font-size: 17px; }
        #r3d-round { top: 62px; right: 16px; font-size: 15px; }
        /* --- Race-track mini-map (loop + live running position) --- */
        /* Sits in the top-left column under the «Поени»/«🌸» pills, NOT centred —
           centred it covered the road right where the kart drives (task 249). */
        #r3d-map {
            position: absolute; top: 112px; left: 16px;
            z-index: 10; pointer-events: none; width: 21vmin; height: 21vmin;
            max-width: 230px; max-height: 230px;
            background: #FFF8ED; border-radius: 16px; border: 4px solid #FFD23F;
            box-shadow: 0 5px 0 rgba(0,0,0,0.25);
        }
        #r3d-map canvas { width: 100%; height: 100%; display: block; border-radius: 12px; }
        /* --- Back button --- */
        /* task 255: chrome from .ps-back; racing3d keeps its bottom-left spot. */
        #r3d-back {
            position: absolute; bottom: 4vmin; left: 4vmin; z-index: 30;
        }
        /* --- Page title --- */
        #r3d-title {
            position: absolute; top: 2vmin; left: 50%; transform: translateX(-50%);
            margin: 0; font-size: 4.5vmin; color: #FFF8ED; z-index: 5;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.3); white-space: nowrap;
        }
        /* --- Countdown overlay --- */
        #r3d-countdown {
            position: absolute; top: 32%; left: 50%; transform: translate(-50%, -50%);
            z-index: 30; font-size: 14vmin; font-weight: 800; color: #FFF8ED;
            text-shadow: 0 0 24px rgba(0,0,0,0.5), 4px 4px 0 rgba(0,0,0,0.35);
            display: none; pointer-events: none; white-space: nowrap;
        }
        #r3d-countdown.show { display: block; }
        /* --- Touch controls: full left/right screen-half zones (tablet-first) --- */
        .r3d-zone {
            position: absolute; top: 26vmin; bottom: 0; width: 50%; z-index: 11;
            display: flex; align-items: center; justify-content: center;
            touch-action: none;
        }
        /* Push the steering buttons out toward the screen edges so they do not sit
           under the kart (task 249); the padding keeps them off the bezel. */
        #r3d-zone-left { left: 0; justify-content: flex-start; padding-left: 4vmin; }
        #r3d-zone-right { right: 0; justify-content: flex-end; padding-right: 4vmin; }
        /* task 255: bubble chrome from components.css (.ps-btn--control);
           the zones keep layout/padding only. Steering = secondary tint.
           task 256: the steering controls are the biggest targets in the game,
           so they are 1.5x the shared control size and sit one whole control
           width closer to the middle — the child grips inboard, not on the
           bezel. (task 249 pushed them out to the edges; this brings each one
           back in by exactly its own width, not to the centre.) */
        .r3d-zone .r3d-btn {
            --r3d-steer: min(165px, 25.5vmin);   /* 1.5 x min(110px, 17vmin) */
            width: var(--r3d-steer);
            height: var(--r3d-steer);
            font-size: min(60px, 10.5vmin);      /* the triangle glyph scales too */
            flex: 0 0 auto;                      /* never shrink to fit the half */
            display: flex; align-items: center; justify-content: center;
        }
        #r3d-zone-left .r3d-btn { margin-left: var(--r3d-steer); }
        #r3d-zone-right .r3d-btn { margin-right: var(--r3d-steer); }
        /* --- Screen-reader live region --- */
        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
        }
        /* --- Landscape lock hint (portrait tablets) --- */
        #r3d-landscape-hint {
            display: none; position: absolute; inset: 0; z-index: 40;
            background: rgba(74, 63, 107, 0.92); color: #FFF8ED;
            align-items: center; justify-content: center; text-align: center;
            font-size: 26px; font-weight: 700; padding: 6vmin;
        }
        @media (orientation: portrait) and (min-width: 520px) {
            #r3d-landscape-hint { display: flex; }
        }
        /* --- Win modal --- */
        #r3d-win-modal {
            display: none; position: absolute; inset: 0; z-index: 20;
            background: rgba(74, 63, 107, 0.85); flex-direction: column;
            justify-content: center; align-items: center; padding: 4vmin;
        }
        #r3d-win-modal.show { display: flex; }
        #r3d-win-modal h1 {
            font-size: 24px; color: #FFF8ED; margin: 0 0 24px; text-align: center;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.35);
        }
        #r3d-win-score {
            color: #FFD23F; font-size: 20px; font-weight: 700; margin: 0 0 24px; text-align: center;
        }
        /* task 255: modal actions take the bubble chrome from components.css.
           task 244's three-way colour coding collapses into the unified
           two-tone system (user-approved scope): green = go/next primary,
           sky = replay/pick secondary — labels + icons still distinguish. */
        .r3d-restart-btn {
            padding: 16px 40px; font-size: 18px; font-weight: 700;
        }
        /* --- Top-right corner controls (world picker + music) --- */
        .r3d-corner {
            /* must sit above .r3d-zone (z-index 11): on short landscape screens
               26vmin is smaller than 118px, so the zones start above these
               buttons and swallowed the world/music taps. */
            position: absolute; top: 118px; right: 16px; z-index: 20;
            display: flex; gap: 8px;
        }
        /* task 255: chrome from components.css (.ps-btn--icon + --secondary);
           layout/pointer behaviour stays here. */
        .r3d-corner button {
            pointer-events: auto; font-size: 19px; font-family: inherit;
        }
        /* --- Start modal: world cards + kart color picker --- */
        #r3d-start-modal {
            display: none; position: absolute; inset: 0; z-index: 25;
            background: rgba(74, 63, 107, 0.88); align-items: center; justify-content: center; padding: 4vmin;
        }
        #r3d-start-modal.show { display: flex; }
        .r3d-start-box {
            background: #FFF8ED; border-radius: 24px; border: 5px solid #FFD23F;
            box-shadow: 0 10px 0 rgba(0,0,0,0.25); padding: 20px;
            max-width: 580px; width: 100%; max-height: 92%; overflow: auto; text-align: center;
        }
        .r3d-start-box h1 { color: #4A3F6B; margin: 0 0 14px; font-size: 22px; }
        #r3d-world-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
        .r3d-world-card {
            border: 4px solid #E8DFD0; background: #fff; border-radius: 16px; cursor: pointer;
            padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.12); font-family: inherit;
        }
        .r3d-world-card.sel { border-color: #FFD23F; background: #FFF3C9; box-shadow: 0 4px 0 #E0B800; transform: translateY(-2px); }
        .r3d-world-card .wc-emoji { font-size: 26px; }
        .r3d-world-card .wc-name { font-size: 13px; font-weight: 700; color: #4A3F6B; }
        .r3d-kart-label { color: #4A3F6B; font-weight: 700; margin-bottom: 8px; font-size: 15px; }
        #r3d-kart-row { display: flex; justify-content: center; gap: 12px; margin-bottom: 18px; }
        .r3d-kart-swatch {
            width: 46px; height: 46px; border-radius: 50%; cursor: pointer;
            border: 4px solid #fff; box-shadow: 0 3px 0 rgba(0,0,0,0.2);
        }
        .r3d-kart-swatch.sel { border-color: #4A3F6B; transform: scale(1.12); }
        .r3d-win-actions { display: flex; flex-direction: column; gap: 12px; align-items: center; }
        /* Short landscape (V3.2): the start box overflowed its 92% cap by 123px
           at 844x390, so «Крени!» sat below the fold behind a scroll. Compact
           the chrome and collapse the secondary kart-colour label (§11 order:
           decoration → secondary text → controls → stage → typography). */
        @media (max-height: 520px) {
            .r3d-start-box { padding: 8px; }
            .r3d-start-box h1 { font-size: 18px; margin: 0 0 4px; }
            #r3d-world-grid { gap: 6px; margin-bottom: 8px; }
            .r3d-world-card { padding: 4px 2px; }
            .r3d-world-card .wc-emoji { font-size: 20px; }
            .r3d-world-card .wc-name { font-size: 11px; }
            .r3d-kart-label { display: none; }
            #r3d-kart-row { gap: 8px; margin-bottom: 4px; }
            .r3d-kart-swatch { width: 40px; height: 40px; }
            .r3d-restart-btn { padding: 10px 30px; font-size: 16px; line-height: 1.1; }
            /* keep the minimap above the (edge-pushed) steering button on a 390h phone */
            #r3d-map { top: 106px; width: 16vmin; height: 16vmin; }
        }
    </style>
</head>
<body>
<div id="r3d-game">
    <button class="adv-back ps-back" id="r3d-back" aria-label="Назад"><svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
    <h1 id="r3d-title">🏎️ Мала тркачица 3Д</h1>

    <div id="r3d-score" class="r3d-pill">Поени: 0</div>
    <div id="r3d-flowers" class="r3d-pill">🌸 0/12</div>
    <div id="r3d-world" class="r3d-pill">Ливада</div>
    <div id="r3d-round" class="r3d-pill">Круг 1/3</div>
    <div class="r3d-corner">
        <button id="r3d-world-btn" class="ps-btn ps-btn--icon ps-btn--secondary" aria-label="Изабери свет"><svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg></button>
        <button id="r3d-music-btn" class="ps-btn ps-btn--icon ps-btn--secondary ps-icon-toggle" aria-label="Музика"><svg class="ic-main" viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg><svg class="ic-alt" viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path fill="currentColor" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg></button>
    </div>

    <div id="r3d-map" aria-hidden="true"></div>

    <div id="r3d-countdown"></div>

    <div id="r3d-view"></div>

    <div id="r3d-zone-left" class="r3d-zone">
        <button class="r3d-btn ps-btn ps-btn--control ps-btn--secondary" id="r3d-left" aria-label="Лево"><span class="ps-tri ps-tri--left" aria-hidden="true"></span></button>
    </div>
    <div id="r3d-zone-right" class="r3d-zone">
        <button class="r3d-btn ps-btn ps-btn--control ps-btn--secondary" id="r3d-right" aria-label="Десно"><span class="ps-tri ps-tri--right" aria-hidden="true"></span></button>
    </div>

    <div id="r3d-win-modal">
        <h1>СТИГАО СИ НА ЦИЉ! 🏁</h1>
        <div id="r3d-win-score"></div>
        <div class="r3d-win-actions">
            <button class="r3d-restart-btn ps-btn" id="r3d-next-world"><svg class="ps-icon" viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path fill="currentColor" d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg> Следећи свет</button>
            <button class="r3d-restart-btn ps-btn ps-btn--secondary" id="r3d-restart"><svg class="ps-icon" viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-8 8s3.58 8 8 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg> Играј поново!</button>
            <button class="r3d-restart-btn ps-btn ps-btn--secondary" id="r3d-pick-world"><svg class="ps-icon" viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg> Изабери свет</button>
        </div>
    </div>

    <div id="r3d-start-modal">
        <div class="r3d-start-box">
            <h1>Изабери свет 🌍</h1>
            <div id="r3d-world-grid"></div>
            <div class="r3d-kart-label">Боја картинга: <span id="r3d-kart-name"></span></div>
            <div id="r3d-kart-row"></div>
            <button class="r3d-restart-btn ps-btn" id="r3d-start-btn">Крени! 🏁</button>
        </div>
    </div>

    <div id="r3d-announcer" class="sr-only" role="status" aria-live="polite"></div>
    <div id="r3d-landscape-hint">Окрени уређај водоравно 🌍</div>
</div>

<script type="importmap">{ "imports": { "three": "../assets/lib/three.module.min.js" } }</script>

    <script src="../shared/viewport.js"></script>
    <script src="../shared/input.js"></script>
    <script src="../shared/feedback.js"></script>

    <script src="../data/app-registry.js"></script>
    <script src="../shared/main.js"></script>
</body>
