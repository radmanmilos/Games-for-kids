<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Клавир — Петрин свет</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎹</text></svg>">
<style>
  :root{
    --cream:#FFF8ED;
    --sky:#4FC3F7;
    --yellow:#FFD23F;
    --green:#67C971;
    --pink:#FF6F91;
    --plum:#4A3F6B;
    --plum-soft:#7A6FA0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden; overscroll-behavior:none; touch-action:manipulation;
    background:var(--cream);
    font-family:'Fredoka', sans-serif;
  }
  #app{position:fixed; inset:0; overflow:hidden;}
  .screen{
    position:absolute; inset:0; display:none;
    flex-direction:column; align-items:center;
  }
  .screen.active{display:flex;}

  /* ---------- BACK BUTTON (shared) ---------- */
  .back-btn{
    position:absolute; top:4vmin; left:4vmin; z-index:20;
    width:12vmin; height:12vmin; border-radius:50%; border:none;
    background:var(--plum); color:white; font-size:6vmin;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 1vmin 0 rgba(0,0,0,.2);
    cursor:pointer;
  }
  .back-btn:active{ transform:scale(.9) translateY(3px); }

  #pianoTitle{
    position:absolute; top:4vmin; left:50%; transform:translateX(-50%);
    margin:0; font-size:6.5vmin; color:var(--plum);
    text-shadow:0 3px 0 rgba(255,255,255,.6);
    pointer-events:none;
  }

  /* ---------- CONTROLS ---------- */
  #pianoControls{
    display:flex; flex-direction:column; align-items:center; gap:2.4vmin;
    margin-top:16vmin;
  }
  #pianoModes{ display:flex; gap:2.5vmin; }
  .mode-btn{
    padding:2.4vmin 5vmin; border-radius:50vmin; border:none; cursor:pointer;
    font-family:inherit; font-weight:700; font-size:4vmin;
    color:var(--plum-soft); background:#fff; box-shadow:0 1vmin 0 rgba(0,0,0,.12);
  }
  .mode-btn.on{ background:var(--plum); color:#fff; box-shadow:0 1vmin 0 rgba(0,0,0,.25); }
  .mode-btn:active{ transform:scale(.92) translateY(3px); }

  #songInfo{ display:none; flex-direction:column; align-items:center; gap:1.8vmin; }
  #songInfo.show{ display:flex; }
  #songChips{ display:flex; flex-wrap:wrap; justify-content:center; gap:1.6vmin; max-width:92vmin; }
  .song-chip{
    min-width:9vmin; padding:1.8vmin 2.5vmin; border-radius:50vmin; border:none; cursor:pointer;
    font-family:inherit; font-weight:700; font-size:4.6vmin; line-height:1;
    color:var(--plum-soft); background:#fff; box-shadow:0 1vmin 0 rgba(0,0,0,.12);
  }
  .song-chip.on{ background:var(--plum); color:#fff; box-shadow:0 1vmin 0 rgba(0,0,0,.25); }
  .song-chip:active{ transform:scale(.92) translateY(3px); }
  #songRow{ display:flex; align-items:center; gap:3vmin; }
  #pianoPreview{
    padding:1.8vmin 3.5vmin; border-radius:50vmin; border:none; cursor:pointer;
    font-family:inherit; font-weight:700; font-size:3.4vmin; color:#fff; background:var(--sky);
    box-shadow:0 1vmin 0 rgba(0,0,0,.2);
  }
  #pianoPreview:active{ transform:scale(.92) translateY(3px); }
  #pianoCounter{ margin:0; font-size:3.4vmin; font-weight:600; color:var(--plum-soft); }

  /* ---------- KEYBOARD ---------- */
  #pianoStage{
    flex:1; width:100%; display:flex; align-items:flex-end; justify-content:center;
    padding:0 3vmin;
  }
  #pianoKeys{ display:flex; gap:1.2vmin; width:100%; max-width:110vmin; }
  .piano-key{
    flex:1; height:min(34vmin, 40vh); border:none; border-radius:2.4vmin;
    background:#fff; box-shadow:0 1vmin 0 rgba(0,0,0,.14);
    position:relative; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    font-family:inherit;
  }
  .piano-key::before{
    content:''; position:absolute; left:0; right:0; top:0; height:26%;
    border-radius:2.4vmin 2.4vmin 0 0; background:var(--kcolor);
  }
  .piano-key .k-note{ font-size:3vmin; font-weight:700; color:#B9B2CC; margin-bottom:2.4vmin; }
  .piano-key:active{ transform:translateY(2px) scale(.97); }
  .piano-key.lit{ background:var(--kcolor); transform:translateY(-2vmin); }
  .piano-key.lit .k-note{ color:#fff; }
  .piano-key.lit::before{ background:rgba(255,255,255,.35); }
  .piano-key.hit{ animation:keyPop .3s ease; }
  .piano-key.shake{ animation:keyShake .35s ease; }
  @keyframes keyPop{ 0%,100%{transform:scale(1)} 40%{transform:scale(.93)} }
  @keyframes keyShake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
  @media (prefers-reduced-motion: reduce){
    .piano-key.hit, .piano-key.shake{ animation:none; }
    .piano-key.lit{ transform:none; }
  }

  /* ---------- FEEDBACK ---------- */
  #pianoFeedback{ height:6vmin; margin:1vmin 0 3vmin; font-size:4vmin; font-weight:700; color:var(--pink); text-align:center; }

  /* ---------- FINISH PANEL ---------- */
  #pianoFinish{
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(74,63,107,.45); z-index:30;
  }
  #pianoFinish.show{ display:flex; }
  #pianoFinishCard{
    background:#fff; border-radius:4vmin; padding:6vmin 9vmin;
    display:flex; flex-direction:column; align-items:center; gap:3vmin;
    box-shadow:0 3vmin 8vmin rgba(0,0,0,.3);
    text-align:center;
  }
  #pianoFinishEmoji{ font-size:14vmin; line-height:1; }
  #pianoFinishTitle{ margin:0; font-size:5vmin; font-weight:700; color:var(--plum); }
  #pianoFinishSub{ margin:0; font-size:3.6vmin; font-weight:600; color:var(--plum-soft); }
  #pianoReplay{
    padding:3vmin 7vmin; border-radius:50vmin; border:none; cursor:pointer;
    font-family:inherit; font-weight:700; font-size:4.2vmin; color:#0B3D1A; background:var(--green);
    box-shadow:0 1.2vmin 0 rgba(0,0,0,.2);
  }
  #pianoReplay:active{ transform:scale(.92) translateY(3px); }
</style>
<link rel="stylesheet" href="../shared/accessibility.css">
</head>
<body>
<div id="app">

  <div class="screen active" id="game-piano">
    <button class="back-btn" id="piano-back" aria-label="Назад"><svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
    <h1 id="pianoTitle">Клавир</h1>

    <div id="pianoControls">
      <div id="pianoModes">
        <button id="modeFree" class="mode-btn on">Свирај</button>
        <button id="modeSong" class="mode-btn">Свирај песму</button>
      </div>
      <div id="songInfo">
        <div id="songChips"></div>
        <div id="songRow">
          <button id="pianoPreview">🔊 Чуј песму</button>
          <p id="pianoCounter">1 од 42</p>
        </div>
      </div>
    </div>

    <div id="pianoStage">
      <div id="pianoKeys" role="group" aria-label="Клавирске дирке"></div>
    </div>

    <p id="pianoFeedback"></p>
  </div>

  <div id="pianoFinish" aria-hidden="true">
    <div id="pianoFinishCard">
      <div id="pianoFinishEmoji">🏅</div>
      <h2 id="pianoFinishTitle">Свирао си песму!</h2>
      <p id="pianoFinishSub"></p>
      <button id="pianoReplay">Играј поново</button>
    </div>
  </div>

</div>

<script src="../shared/navigation.js"></script>
<script src="../shared/audio.js"></script>
<script src="../shared/speech.js"></script>
<script src="../shared/celebration.js"></script>
<script src="../games/piano.js"></script>
<script src="../shared/main.js"></script>
</body>
</html>
