<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#4A3F6B">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Мала истраживачица — Петрин свет</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
  <link rel="stylesheet" href="../styles/viewport.css">
  <link rel="stylesheet" href="../styles/design-tokens.css">
  <link rel="stylesheet" href="../shared/accessibility.css">
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
    html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;background:#5c94fc;font-family:'Fredoka',sans-serif;}
    #app{position:fixed;inset:0;overflow:hidden;}
    #canvas{width:100%;height:100%;display:block;}
    .hud{position:absolute;z-index:10;display:flex;align-items:center;gap:2vmin;padding:1.5vmin 3vmin;background:rgba(0,0,0,.45);border:3px solid white;border-radius:12px;color:white;font:600 clamp(12px,2.4vmin,22px)/1.5 'Fredoka',sans-serif;pointer-events:none;}
    #hud-world{top:2vmin;left:50%;transform:translateX(-50%);}
    #hud-level{top:2vmin;left:2vmin;}
    #hud-coins{top:2vmin;right:2vmin;}
    .hud-btn{position:absolute;z-index:10;width:10vmin;height:10vmin;border-radius:50%;border:3px solid white;background:rgba(0,0,0,.45);color:white;font-size:5vmin;display:flex;align-items:center;justify-content:center;cursor:pointer;}
    .hud-btn:active{transform:scale(.92);}
    #worlds-btn{bottom:24vmin;right:2vmin;}
    #music-btn{bottom:12vmin;right:2vmin;}
    #win-modal{display:none;position:absolute;inset:0;z-index:20;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.7);color:#FFD23F;text-align:center;padding:5vmin;}
    #win-modal.show{display:flex;}
    #win-modal h2{font-size:clamp(22px,5vmin,48px);margin:0 0 4vmin;}
    #win-modal p{font-size:clamp(16px,3.5vmin,32px);margin:0 0 4vmin;}
    #win-modal button{border:4px solid white;border-radius:12px;background:#67C971;color:white;padding:2vmin 4vmin;font:600 clamp(14px,2.5vmin,24px) 'Fredoka',sans-serif;box-shadow:0 6px 0 #267b35;cursor:pointer;}
    #worlds-modal{display:none;position:absolute;inset:0;z-index:20;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.8);padding:5vmin;}
    #worlds-modal.show{display:flex;}
    /* Character picker. This modal had NO css at all, so it stayed in normal flow
       inside #app (position:fixed; overflow:hidden) and rendered ~1090px down,
       clipped off-screen and untappable — the game could not be started by a
       child. The smoke missed it because it calls .char-btn.click() directly,
       which bypasses hit-testing. Same modal treatment as #win-modal. */
    #char-modal{display:none;position:absolute;inset:0;z-index:20;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.7);color:#FFD23F;text-align:center;padding:5vmin;}
    #char-modal.show{display:flex;}
    #char-modal h2{font-size:clamp(22px,5vmin,48px);margin:0 0 4vmin;}
    #worlds-modal h2{color:#FFD23F;font-size:clamp(20px,4vmin,40px);margin:0 0 3vmin;}
    #worlds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:2vmin;width:min(90vw,600px);}
    #worlds-grid button{padding:2vmin;border-radius:12px;border:3px solid white;background:rgba(255,255,255,.15);color:white;font:600 clamp(12px,2.5vmin,20px) 'Fredoka',sans-serif;cursor:pointer;}
    #worlds-grid button:active{transform:scale(.95);}
    #worlds-close{margin-top:3vmin;border:3px solid white;border-radius:12px;background:rgba(255,255,255,.15);color:white;padding:1.5vmin 3vmin;font:600 clamp(12px,2.5vmin,20px) 'Fredoka',sans-serif;cursor:pointer;}
    .back-btn{position:absolute;top:2vmin;left:2vmin;z-index:30;width:10vmin;height:10vmin;border-radius:50%;border:none;background:rgba(74,63,107,.85);color:white;font-size:5vmin;display:flex;align-items:center;justify-content:center;cursor:pointer;}
    .back-btn:active{transform:scale(.9);}
    .btn{pointer-events:auto;width:100px;height:100px;border-radius:50%;border:6px solid #fff;display:flex;justify-content:center;align-items:center;font-size:40px;color:white;box-shadow:0 8px 0 rgba(0,0,0,.3),inset 0 -4px 0 rgba(0,0,0,.2);cursor:pointer;text-shadow:3px 3px 0 rgba(0,0,0,.3);font-family:inherit;}
    .btn:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.3);}
    .btn-left{background-color:#e52521;}
    .btn-right{background-color:#fbd000;color:#4A3F6B;text-shadow:none;}
    .btn-jump{width:120px;height:120px;background-color:#43b047;border-color:#fff;font-size:50px;animation:pulse 2s infinite ease-in-out;}
    @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
  </style>
</head>
<body>
  <div id="app">
    <canvas id="canvas"></canvas>
    <div class="hud" id="level-num">Свет 1</div>
    <div class="hud" id="world-name">Свет</div>
    <div class="hud" id="coin-count">⭐ 0</div>
    <span id="collect-emoji" style="position:absolute;left:-9999px;top:-9999px;">🍓</span>
    <button class="hud-btn" id="worlds-btn" aria-label="Изабери свет">🌍</button>
    <button class="hud-btn" id="music-btn" aria-label="Музика">🔊</button>
    <button id="back-btn" class="back-btn" aria-label="Назад"><svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
    <div class="btn btn-left" id="btn-left">◀</div>
    <div class="btn btn-right" id="btn-right">▶</div>
    <div class="btn btn-jump" id="btn-jump">🐾</div>
    <div id="win-modal" role="dialog" aria-label="Победа">
      <h2 id="win-title">СВЕТ ПРЕЂЕН!</h2>
      <p id="win-sub"></p>
      <button id="modal-btn">СЛЕДЕЋИ СВЕТ! 🚀</button>
    </div>
    <div id="char-modal" role="dialog" aria-label="Изабери лик">
      <h2>Изабери лик</h2>
      <div style="display:flex;gap:3vmin;justify-content:center;">
        <button class="char-btn" data-character="kitty" aria-label="Маца"><img src="../assets/images/explorer_kitty/01_idle_right.png" alt="Маца" style="width:12vmin;height:12vmin;"></button>
        <button class="char-btn" data-character="explorer" aria-label="Истраживачица"><img src="../assets/images/explorer/01_idle_right.png" alt="Истраживачица" style="width:12vmin;height:12vmin;"></button>
      </div>
    </div>
    <div id="worlds-modal" role="dialog" aria-label="Изабери свет">
      <h2>Изабери свет</h2>
      <div id="worlds-grid"></div>
      <button id="worlds-close">Затвори</button>
    </div>
  </div>

  <script src="../data/serbian.js"></script>
  <script src="../shared/navigation.js"></script>
  <script src="../shared/celebration.js"></script>
  <script src="../shared/audio.js"></script>
  <script src="../shared/speech.js"></script>
  <script src="../shared/utils.js"></script>
  <script src="../shared/audio-buses.js"></script>
  <script src="../shared/viewport.js"></script>
  <script src="../shared/input.js"></script>
  <script src="../shared/feedback.js"></script>
  <script src="../shared/motion.js"></script>
  <script src="../games/kitty-standalone.js"></script>
  <script src="../data/app-registry.js"></script>
  <script src="../shared/main.js"></script>
</body>
</html>
