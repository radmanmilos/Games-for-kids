<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Слагалице — Петрин свет</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
<link rel="stylesheet" href="../shared/accessibility.css">
<style>
:root{--cream:#FFF8ED;--yellow:#FFD23F;--green:#67C971;--plum:#4A3F6B;--plum-soft:#7A6FA0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--cream);font-family:'Fredoka',sans-serif;color:var(--plum)}
#app{position:fixed;inset:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;overflow:auto;padding:4vmin}
.back-btn{position:fixed;top:4vmin;left:4vmin;z-index:30;width:12vmin;height:12vmin;border:0;border-radius:50%;background:var(--plum);color:#fff;font-size:6vmin;display:flex;align-items:center;justify-content:center;box-shadow:0 1vmin 0 rgba(0,0,0,.2)}
.puzzle-area{display:flex;flex-direction:column;align-items:center;gap:2vmin;width:100%;padding-top:2vmin}
h1{font-size:clamp(24px,5vmin,48px);margin:0}
.puzzle-info{color:var(--plum-soft);font-weight:600}
.scene-button{border:0;border-radius:16px;padding:0;background:#fff;box-shadow:0 1.5vmin 0 rgba(0,0,0,.12);cursor:pointer;overflow:hidden;width:min(58vw,500px);aspect-ratio:3/2}
#scenePreview{display:block;width:100%;height:100%}
.scene-hint{font-size:clamp(15px,2.5vmin,24px);font-weight:700}
#puzzleStage{position:relative;width:min(94vw,900px);height:min(72vh,600px);min-height:360px}
#puzzleBoard{position:absolute;left:50%;top:50%;width:min(58vw,500px);height:auto;aspect-ratio:3/2;transform:translate(-50%,-50%);display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);border:clamp(4px,1vmin,8px) dashed rgba(74,63,107,.35);border-radius:16px;background:rgba(255,255,255,.8);box-shadow:0 1.5vmin 3vmin rgba(0,0,0,.1);overflow:hidden}
.board-slot{border:1px dashed rgba(74,63,107,.2)}
.piece{position:absolute;touch-action:none;background-repeat:no-repeat;border:clamp(3px,.8vmin,6px) solid #fff;border-radius:10px;box-shadow:0 1vmin 1.5vmin rgba(0,0,0,.2);cursor:grab;z-index:5}
.piece.dragging{cursor:grabbing;z-index:10;transform:scale(1.06);box-shadow:0 1.5vmin 2vmin rgba(0,0,0,.28)}
.piece.placed{z-index:4;border-color:var(--green);box-shadow:none;cursor:default;pointer-events:none;transform:none}
#puzzleNext{display:none;width:14vmin;height:14vmin;border:0;border-radius:50%;background:var(--yellow);color:var(--plum);font-size:7vmin;box-shadow:0 1vmin 0 rgba(0,0,0,.15)}
#puzzleNext.show{display:block}
.score{position:fixed;top:4vmin;right:4vmin;background:var(--plum);color:#fff;border-radius:999px;padding:1.2vmin 3vmin;font-size:clamp(16px,3vmin,28px);font-weight:700}
@media(max-width:600px){#puzzleStage{min-height:330px}}
</style>
</head>
<body>
<div id="app"></div>
<script src="../shared/navigation.js"></script>
<script src="../shared/celebration.js"></script>
<script src="../shared/audio.js"></script>
<script src="../shared/utils.js"></script>
<script src="../games/animal_puzzle.js"></script>
<script>document.addEventListener('DOMContentLoaded',()=>{if(window.startAnimalPuzzle)window.startAnimalPuzzle()})</script>
</body>
</html>
