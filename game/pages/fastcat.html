<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#4A3F6B">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Брзи мачак — Петрин свет</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
  <link rel="stylesheet" href="../styles/viewport.css">
  <link rel="stylesheet" href="../styles/design-tokens.css">
  <link rel="stylesheet" href="../shared/accessibility.css">
  <link rel="stylesheet" href="../styles/components.css">
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
    html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;background:#5c94fc;font-family:'Fredoka',sans-serif;}
    #app{position:fixed;inset:0;overflow:hidden;}
    #canvas{width:100%;height:100%;display:block;}
    .hud{position:absolute;z-index:10;display:flex;align-items:center;gap:2vmin;padding:1.2vmin 2.5vmin;background:rgba(0,0,0,.45);border:3px solid white;border-radius:12px;color:white;font:600 clamp(12px,2.4vmin,22px)/1.5 'Fredoka',sans-serif;pointer-events:none;}
    #score-count{top:2vmin;left:16vmin;}
    #meter-wrap{top:2vmin;left:50%;transform:translateX(-50%);gap:1.5vmin;}
    #meter-label{white-space:nowrap;}
    #meter-bar{width:min(38vmin,260px);height:2.6vmin;min-height:14px;background:rgba(255,255,255,.25);border:2px solid white;border-radius:99px;overflow:hidden;}
    #meter-fill{height:100%;width:0%;background:linear-gradient(90deg,#FFD23F,#FF9FB6);border-radius:99px;transition:width .15s linear;}
    /* task 255: HUD chrome from components.css (.ps-btn--icon bubble); position
       + glyph size only. #super-btn keeps its bespoke ready/active state
       machine (smoke-pinned V21 cues) and re-declares its own ring. */
    .hud-btn{position:absolute;z-index:10;font-size:5vmin;}
    /* play-test 6: moved a bit further up — the 9vmin gap still felt tight
       on the real phone; 12vmin keeps a clear shelf of its own. */
    #super-btn{right:calc(2vmin + env(safe-area-inset-right));bottom:calc(2vmin + env(safe-area-inset-bottom) + min(110px,17vmin) + 12vmin);width:14vmin;height:14vmin;min-width:56px;min-height:56px;font-size:7vmin;background:rgba(0,0,0,.45);opacity:.55;border:3px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;}
    /* ready: the child must SEE "full" without reading anything — bright gold,
       a thick white ring + outer glow, a rotating rainbow ring behind the
       button, and a livelier bounce (was a timid 1.08 scale). */
    #super-btn.ready{opacity:1;background:linear-gradient(180deg,#FFE45C,#FFB300);color:#4A3F6B;border-color:#fff;box-shadow:0 1vmin 0 rgba(0,0,0,.25),0 0 0 4px #fff,0 0 3.5vmin 1.2vmin rgba(255,210,63,.85);font-size:8vmin;animation:superPulse .5s ease-in-out infinite alternate;}
    #super-btn.ready::after{content:'';position:absolute;inset:-2.4vmin;border-radius:50%;background:conic-gradient(#FFD23F,#FF6B6B,#FFE45C,#FF9FB6,#FFD23F);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2vmin),#000 calc(100% - 2vmin));mask:radial-gradient(farthest-side,transparent calc(100% - 2vmin),#000 calc(100% - 2vmin));animation:superRing 1.6s linear infinite;z-index:-1;}
    #super-btn.active{opacity:1;background:#FF6B6B;color:white;text-shadow:2px 2px 0 rgba(0,0,0,.3);animation:none;}
    #super-btn.active::after{display:none;}
    @keyframes superPulse{from{transform:scale(1);}to{transform:scale(1.14);}}
    @keyframes superRing{to{transform:rotate(360deg);}}
    /* V21 (§39): superPulse/superRing are state cues ("meter full — tap ⚡"),
       they only run while #super-btn.ready is actionable; freeze both under
       reduced motion like the other justified indefinite cues. */
    @media (prefers-reduced-motion: reduce){ #super-btn.ready{ animation:none; } #super-btn.ready::after{ animation:none; } }
    .back-btn{position:absolute;top:2vmin;left:2vmin;z-index:30;}
    /* task 255: chrome (bubble look, size, states) comes from components.css
       (.ps-btn--control); this page only owns POSITION — fastcat's corner
       layout is the canonical control placement every game will adopt. */
    .btn{position:absolute;bottom:calc(2vmin + env(safe-area-inset-bottom));z-index:10;pointer-events:auto;}
    .btn-slide{left:calc(2vmin + env(safe-area-inset-left));}
    .btn-jump{right:calc(2vmin + env(safe-area-inset-right));}
    #win-modal{display:none;position:absolute;inset:0;z-index:20;align-items:center;justify-content:center;flex-direction:column;background:rgba(74,63,107,.72);color:#FFD23F;text-align:center;padding:5vmin;}
    #win-modal.show{display:flex;}
    #win-modal h2{font-size:clamp(22px,5vmin,48px);margin:0 0 4vmin;}
    #win-modal p{font-size:clamp(16px,3.5vmin,32px);margin:0 0 4vmin;color:white;}
    /* task 255: chrome from components.css (primary .ps-btn pill); sizing only. */
    #win-modal button{padding:2vmin 4vmin;font:600 clamp(14px,2.5vmin,24px) 'Fredoka',sans-serif;}
    /* replay is a small round icon-only button (repeat glyph; the label lives
       in aria-label/title for the parent). task 255: chrome from .ps-btn--icon
       + --secondary (replay is not the primary action); size stays. */
    #win-modal #modal-btn{width:clamp(48px,11vmin,64px);height:clamp(48px,11vmin,64px);padding:0;margin-top:3vmin;font-size:clamp(22px,5.5vmin,32px);}
    #char-modal{display:none;position:absolute;inset:0;z-index:20;align-items:center;justify-content:center;flex-direction:column;background:rgba(74,63,107,.72);color:#FFD23F;text-align:center;padding:5vmin;}
    #char-modal.show{display:flex;}
    #char-modal h2{font-size:clamp(22px,5vmin,48px);margin:0 0 4vmin;}
    /* task 255: modal choice tiles keep the translucent look but share the
       bubble's solid depth shadow + translateY press. */
    #char-modal .char-btn{padding:2vmin;border-radius:16px;border:4px solid white;background:rgba(255,255,255,.15);cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.22);transition:transform .12s ease,box-shadow .12s ease;}
    #char-modal .char-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22);}
    #char-modal .char-btn img{width:14vmin;height:14vmin;display:block;}
    /* play-test 4 (task 254): themed levels — 🌍 picker + ♪ music toggle on
       the free top-right corner, the level name sits bottom-centre between
       the two thumb buttons (pointer-events:none — never a touch target). */
    #levels-btn{top:calc(2vmin + env(safe-area-inset-top));right:calc(2vmin + env(safe-area-inset-right));}
    #music-btn{top:calc(2vmin + env(safe-area-inset-top) + 10vmin + 2vmin);right:calc(2vmin + env(safe-area-inset-right));}
    #music-btn .ic-alt{display:none;}
    #music-btn.off .ic-main{display:none;}
    #music-btn.off .ic-alt{display:block;}
    #level-label{top:auto;bottom:calc(2vmin + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);white-space:nowrap;pointer-events:none;}
    #level-modal{display:none;position:absolute;inset:0;z-index:20;align-items:center;justify-content:center;flex-direction:column;background:rgba(74,63,107,.85);padding:5vmin;}
    #level-modal.show{display:flex;}
    #level-modal h2{color:#FFD23F;font-size:clamp(20px,4vmin,40px);margin:0 0 3vmin;}
    #level-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:2vmin;width:min(90vw,600px);}
    /* task 255: level tiles are modal CHOICES — translucent tiles keep their
       shape, but share the bubble's solid depth + translateY press. */
    #level-grid .level-btn{padding:2vmin;border-radius:12px;border:3px solid white;background:rgba(255,255,255,.15);color:white;font:600 clamp(12px,2.5vmin,20px) 'Fredoka',sans-serif;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.22);transition:transform .12s ease,box-shadow .12s ease;}
    #level-grid .level-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22);}
    #level-grid .lv-emoji{display:block;font-size:clamp(20px,5vmin,40px);}
    /* task 255: Затвори is a secondary action — .ps-btn + --secondary pill. */
    #level-close{margin-top:3vmin;padding:1.5vmin 3vmin;font:600 clamp(12px,2.5vmin,20px) 'Fredoka',sans-serif;}
    /* play-test 7: the end-of-level action must be unmissable (this rule
       previously carried `display:none` + a blue override: the win block only
       ever cleared the INLINE style, so the stylesheet's display:none kept the
       button computed-hidden and the child saw only the replay). The
       #win-modal wrapper hides it until the win, so the button itself needs no
       display:none; task 255: it takes the primary .ps-btn bubble pill and a
       bigger label. */
    #win-modal #next-btn{display:inline-block;margin-top:3vmin;font-size:clamp(18px,4vmin,30px);}
    /* play-test 8: the repeat glyph was reported invisible on a phone even
       though it measured 22px dark-on-yellow headlessly — size it EXPLICITLY
       in CSS (no reliance on em-in-attribute resolution) and make it chunky
       enough to read at a glance: 1.5em inside the 48-64px disc. */
    #win-modal #modal-btn svg{width:1.5em;height:1.5em;flex:none;}
    /* play-test 2: portrait play is allowed — no rotate gate; the layout
       (full-bleed canvas + corner controls) works in both orientations. */
  </style>
</head>
<body>
  <div id="app">
    <canvas id="canvas"></canvas>
    <button id="back-btn" class="back-btn ps-back" aria-label="Назад"><svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
    <button class="hud-btn ps-btn ps-btn--icon ps-btn--secondary" id="levels-btn" aria-label="Изабери ниво">🌍</button>
    <button class="hud-btn ps-btn ps-btn--icon ps-btn--secondary" id="music-btn" aria-label="Музика"><svg class="ic-main" viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg><svg class="ic-alt" viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path fill="currentColor" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg></button>
    <div class="hud" id="score-count">⭐ 0</div>
    <div class="hud" id="meter-wrap">
      <span id="meter-label">СУПЕР ⚡</span>
      <div id="meter-bar" role="progressbar" aria-label="Супер брзина" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="meter-fill"></div></div>
    </div>
    <button class="hud-btn" id="super-btn" aria-label="Супер брзина ⚡">⚡</button>
    <div class="btn btn-slide ps-btn ps-btn--control ps-btn--secondary" id="btn-slide" role="button" aria-label="Клизање"><span class="ps-tri ps-tri--down" aria-hidden="true"></span></div>
    <div class="btn btn-jump ps-btn ps-btn--control" id="btn-jump" role="button" aria-label="Скок"><span class="ps-tri" aria-hidden="true"></span></div>
    <div class="hud" id="level-label">1 · Прашума 🌺</div>
    <div id="win-modal" role="dialog" aria-label="Победа">
      <h2>СВЕТ ПРЕЂЕН!</h2>
      <p id="win-sub"></p>
      <button id="next-btn" class="ps-btn">СЛЕДЕЋИ СВЕТ!</button>
      <button id="modal-btn" class="ps-btn ps-btn--icon ps-btn--secondary" aria-label="Играј поново" title="Играј поново"><svg class="ps-icon" viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-8 8s3.58 8 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></button>
    </div>
    <div id="level-modal" role="dialog" aria-label="Изабери ниво">
      <h2>Изабери ниво</h2>
      <div id="level-grid"></div>
      <button id="level-close" class="ps-btn ps-btn--secondary">Затвори</button>
    </div>
    <div id="char-modal" role="dialog" aria-label="Изабери лик">
      <h2>Изабери лик</h2>
      <div style="display:flex;gap:3vmin;justify-content:center;">
        <button class="char-btn" data-character="kitty" aria-label="Маца"><img src="../assets/images/explorer_kitty/01_idle_right.png" alt="Маца"></button>
        <button class="char-btn" data-character="explorer" aria-label="Истраживачица"><img src="../assets/images/explorer/01_idle_right.png" alt="Истраживачица"></button>
      </div>
    </div>
  </div>

  <script src="../data/serbian.js"></script>
  <script src="../shared/navigation.js"></script>
  <script src="../shared/celebration.js"></script>
  <script src="../shared/audio.js"></script>
  <script src="../shared/speech.js"></script>
  <script src="../shared/utils.js"></script>
  <script src="../games/fastcat.js"></script>
  <script src="../shared/audio-buses.js"></script>
  <script src="../shared/viewport.js"></script>
  <script src="../shared/input.js"></script>
  <script src="../shared/feedback.js"></script>
  <script src="../shared/motion.js"></script>
  <script src="../data/app-registry.js"></script>
  <script src="../shared/main.js"></script>
</body>
</html>
