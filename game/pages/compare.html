<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#4A3F6B">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Више или мање — Петрин свет</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
<link rel="stylesheet" href="../styles/viewport.css">
<link rel="stylesheet" href="../styles/design-tokens.css">
<link rel="stylesheet" href="../styles/learning-stage.css">
<link rel="stylesheet" href="../shared/accessibility.css">
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;background:var(--cream);font-family:Fredoka, sans-serif;color:var(--plum);}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.6vmin;padding:4vmin;}
  .back-btn{position:absolute;top:2.6vmin;left:2.6vmin;width:11vmin;height:11vmin;border-radius:50%;border:none;background:var(--plum);color:#fff;font-size:5vmin;display:flex;align-items:center;justify-content:center;box-shadow:0 1vmin 0 rgba(0,0,0,.2);z-index:20;}
  .back-btn:active{transform:scale(.92) translateY(3px);}
  #compare-prompt{font-size:5.6vmin;font-weight:800;line-height:1.15;text-align:center;}
  .compare-groups{display:flex;gap:3vmin;justify-content:center;align-items:stretch;width:100%;}
  .cmp-group{min-width:31vmin;min-height:33vmin;padding:2vmin;border:3px solid rgba(74,63,107,.12);border-radius:var(--radius-md);background:#fff;box-shadow:0 1.6vmin 0 rgba(0,0,0,.06);display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:1.4vmin;cursor:pointer;transition:transform .12s ease;}
  .cmp-group:active{transform:translateY(3px);}
  .cmp-item{font-size:9vmin;line-height:1;pointer-events:none;}
  .compare-answers{display:flex;gap:3vmin;}
  .compare-answers[hidden]{display:none;}
  .cmp-answer{min-width:26vmin;min-height:12vmin;padding:0 3vmin;border:3px solid rgba(74,63,107,.12);border-radius:var(--radius-md);background:var(--yellow);color:var(--plum);font-family:inherit;font-size:4.6vmin;font-weight:800;box-shadow:0 1.4vmin 0 rgba(0,0,0,.08);cursor:pointer;}
  .cmp-answer:active{transform:translateY(3px);}
  #compare-feedback{min-height:6vmin;font-size:4vmin;font-weight:700;color:var(--green);text-align:center;}
  .cmp-wrong{animation:cmp-shake .4s ease;border-color:var(--pink)!important;}
  .cmp-hint{animation:cmp-pulse .8s ease-in-out 2;border-color:var(--green)!important;}
  .cmp-correct{border-color:var(--green)!important;box-shadow:0 0 0 4px rgba(103,201,113,.4);}
  @keyframes cmp-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.4vmin)}75%{transform:translateX(1.4vmin)}}
  @keyframes cmp-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  @media (prefers-reduced-motion: reduce){.cmp-wrong,.cmp-hint{animation:none}}
  @media (min-width:800px){
    #compare-prompt{font-size:44px}
    .cmp-item{font-size:56px}
    .cmp-group{min-width:220px;min-height:230px}
    .cmp-answer{min-width:190px;min-height:84px;font-size:32px}
    #compare-feedback{font-size:30px}
  }
</style>
</head>
<body>
<div id="app">
  <button class="back-btn" id="compare-back" aria-label="Назад"><svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
  <div id="compare-prompt" class="learn-instruction">Где има више?</div>
  <div class="compare-groups learn-stage-mat">
    <button class="cmp-group" id="cmp-group-a" aria-label="Прва група"></button>
    <button class="cmp-group" id="cmp-group-b" aria-label="Друга група"></button>
  </div>
    <div class="compare-answers learn-answers" id="compare-answers" hidden>
    <button class="cmp-answer" id="cmp-yes" data-answer="yes">Да</button>
    <button class="cmp-answer" id="cmp-no" data-answer="no">Не</button>
  </div>
  <div id="compare-feedback" class="learn-feedback" aria-live="polite"></div>
</div>
<script src="../data/serbian.js"></script>
<script src="../shared/navigation.js"></script>
<script src="../shared/celebration.js"></script>
<script src="../shared/audio.js"></script>
<script src="../shared/speech.js"></script>
<script src="../shared/utils.js"></script>
<script src="../games/compare.js"></script>
<script src="../shared/audio-buses.js"></script>
<script src="../shared/viewport.js"></script>
<script src="../shared/input.js"></script>
<script src="../shared/feedback.js"></script>
<script src="../shared/motion.js"></script>
<script src="../data/app-registry.js"></script>
<script src="../shared/main.js"></script>
</body>
</html>
