<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мала истраживачица: Пустоловина</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
    <!-- Fredoka bundled locally (2026-08-03, per user approval — no external deps). Variable font: latin + latin-ext subsets. -->
    <style>
        @font-face {
            font-family: 'Fredoka';
            font-style: normal;
            font-weight: 100 700;
            font-display: swap;
            src: url('../assets/fonts/fredoka-latin.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
            font-family: 'Fredoka';
            font-style: normal;
            font-weight: 100 700;
            font-display: swap;
            src: url('../assets/fonts/fredoka-latin-ext.woff2') format('woff2');
            unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }
    </style>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #5c94fc;
            font-family: 'Fredoka', 'Comic Sans MS', cursive, sans-serif;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        canvas {
            flex: 1;
            width: 100%;
            display: block;
        }

        /* --- Petrin-svet styled HUD --- */
        #score-board {
            position: absolute;
            top: 12px;
            right: 16px;
            z-index: 10;
            background: #FFF8ED;
            color: #4A3F6B;
            border: 4px solid #FFD23F;
            border-radius: 18px;
            padding: 8px 18px;
            line-height: 1.45;
            text-align: center;
            font-weight: 700;
            font-size: 18px;
            box-shadow: 0 5px 0 rgba(0,0,0,0.25);
            pointer-events: none;
            min-width: 130px;
        }
        #score-board .sb-small {
            font-size: 14px;
            font-weight: 600;
            color: #7A6FA0;
        }
        #worlds-btn {
            position: absolute;
            top: 12px;
            right: 200px;
            z-index: 10;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            border: 4px solid #fff;
            background: #4A3F6B;
            color: #fff;
            font-size: 26px;
            box-shadow: 0 5px 0 rgba(0,0,0,0.25);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #worlds-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.25); }
        #music-btn {
            position: absolute;
            top: 12px;
            right: 268px;
            z-index: 10;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            border: 4px solid #fff;
            background: #4A3F6B;
            color: #fff;
            font-size: 24px;
            box-shadow: 0 5px 0 rgba(0,0,0,0.25);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #music-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.25); }
        #music-btn.off { background: #8a82a8; }
        /* keep both HUD buttons on-screen on very narrow viewports (preserves the 68px gap) */
        @media (max-width: 329px) {
            #music-btn { right: 256px; }
            #worlds-btn { right: 188px; }
        }

        /* --- Worlds picker overlay --- */
        #worlds-modal {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 30;
            background: rgba(74, 63, 107, 0.72);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 4vmin;
        }
        #worlds-modal.show { display: flex; }
        #worlds-modal h2 {
            color: #FFF8ED;
            font-size: 26px;
            margin: 0 0 3vmin;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
        }
        #worlds-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(110px, 1fr));
            gap: 12px;
            width: 100%;
            max-width: 560px;
            overflow: auto;
            max-height: 74%;
            padding: 4px;
        }
        .world-btn {
            border: 4px solid #fff;
            border-radius: 18px;
            background: #FFF8ED;
            color: #4A3F6B;
            font-family: inherit;
            font-weight: 700;
            font-size: 15px;
            padding: 10px 6px;
            cursor: pointer;
            box-shadow: 0 5px 0 rgba(0,0,0,0.25);
            line-height: 1.2;
        }
        .world-btn .w-emoji { display: block; font-size: 30px; margin-bottom: 4px; }
        .world-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.25); }
        #worlds-close {
            margin-top: 3vmin;
            border: 4px solid #fff;
            border-radius: 50vmin;
            background: #FF6F91;
            color: #fff;
            font-family: inherit;
            font-weight: 700;
            font-size: 17px;
            padding: 12px 40px;
            box-shadow: 0 5px 0 rgba(0,0,0,0.25);
            cursor: pointer;
        }
        #worlds-close:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.25); }

        /* Touch controls float over the canvas bottom edges (full-screen canvas,
           mirroring the adventure games) so no play area is wasted. */
        #controls {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 12;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 10px 18px calc(14px + env(safe-area-inset-bottom));
            pointer-events: none;
        }

        .d-pad {
            display: flex;
            gap: 16px;
        }

        .btn {
            pointer-events: auto;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 6px solid #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            color: white;
            box-shadow: 0 8px 0 rgba(0,0,0,0.3), inset 0 -4px 0 rgba(0,0,0,0.2);
            cursor: pointer;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.3);
            font-family: inherit;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 rgba(0,0,0,0.3);
        }

        .btn-left { background-color: #e52521; }
        .btn-right { background-color: #fbd000; color: #4A3F6B; text-shadow: none; }

        .btn-jump {
            width: 120px;
            height: 120px;
            background-color: #43b047;
            border-color: #fff;
            font-size: 50px;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        #win-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(74, 63, 107, 0.72);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            padding: 4vmin;
        }
        #win-modal.show { display: flex; }

        #win-modal h1 {
            font-size: 24px;
            color: #FFF8ED;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.35);
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.5;
            padding: 0 20px;
        }

        .play-again-btn {
            padding: 20px 40px;
            font-size: 18px;
            font-family: 'Fredoka', 'Comic Sans MS', cursive, sans-serif;
            font-weight: 700;
            border-radius: 50vmin;
            background: #FFD23F;
            color: #4A3F6B;
            border: 5px solid white;
            box-shadow: 0 8px 0 rgba(0,0,0,0.3);
            cursor: pointer;
        }
        .play-again-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 rgba(0,0,0,0.3); }
    </style>
    <link rel="stylesheet" href="../shared/accessibility.css">
    </head>
<body>

<div id="game-container">
    <div id="score-board">
        СВЕТ <span id="level-num">1</span><br>
        <span id="collect-emoji">🍓</span> <span id="coin-count">0</span><br>
        <span class="sb-small" id="world-name">Пролећни дан</span>
    </div>
    <button id="worlds-btn" aria-label="Светови">🌍</button>
    <button id="music-btn" aria-label="Музика">🔊</button>

    <div id="win-modal">
        <h1 id="win-title">СВЕТ ПРЕЂЕН!</h1>
        <button class="play-again-btn" id="modal-btn">СЛЕДЕЋИ СВЕТ! 🚀</button>
    </div>

    <div id="worlds-modal">
        <h2>🌍 Светови</h2>
        <div id="worlds-grid"></div>
        <button id="worlds-close">Затвори</button>
    </div>

    <canvas id="canvas"></canvas>

    <div id="controls">
        <div class="d-pad">
            <div class="btn btn-left" id="btn-left">◀</div>
            <div class="btn btn-right" id="btn-right">▶</div>
        </div>
        <div class="btn btn-jump" id="btn-jump">🐾</div>
    </div>
</div>

    <script src="../games/kitty-standalone.js"></script>
</body>
</html>
