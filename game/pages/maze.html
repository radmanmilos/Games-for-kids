<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4A3F6B" />
  <title>Путања — Петрин свет</title>
  <link rel="manifest" href="../manifest.json" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>" />
  <link rel="stylesheet" href="../styles/viewport.css" />
  <link rel="stylesheet" href="../styles/design-tokens.css" />
  <link rel="stylesheet" href="../shared/accessibility.css" />
  <link rel="stylesheet" href="../styles/components.css">
  <style>
    /* V9 (spec §27): a restrained cozy-garden layer over the same maze logic —
       soft green ground, deep hedge walls, a warm sand path, a house landmark
       and a few garden motifs on the walls. No enemies, timer or punishment. */
    :root{
      --maze-grass:#d9efcf;
      --maze-hedge:#3f8a4f;
      --maze-path:#f3e2b0;
      --maze-path-done:#c3e6c8;
      --maze-goal:#ffe6a6;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
    html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;background:var(--cream);font-family:Fredoka,sans-serif;color:var(--plum)}
    #app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vmin;padding:3vmin}
    .back-btn{position:absolute;top:2.6vmin;left:2.6vmin;z-index:20}
    #maze-prompt{font-size:5.6vmin;font-weight:800;text-align:center}

    /* The board keeps the maze's own aspect ratio, so a stone is square and the
       path never distorts between a phone and a desktop. */
    #maze-stage{
      position:relative;
      width:min(88vmin,460px);
      aspect-ratio:6/4;
      border-radius:4vmin;
      border:0.6vmin solid var(--maze-hedge);
      box-shadow:0 1vmin 0 rgba(0,0,0,.08);
      overflow:hidden;
      touch-action:none;
    }
    /* Soft grass with a couple of faint tufts, so the ground reads as a lawn
       without competing with the path. */
    .maze-ground{position:absolute;inset:0;background:
      radial-gradient(circle at 24% 32%, rgba(255,255,255,.5) 0 1.1%, transparent 1.6%),
      radial-gradient(circle at 74% 68%, rgba(255,255,255,.45) 0 .9%, transparent 1.4%),
      var(--maze-grass);
      background-size:24% 24%,30% 30%,auto}
    /* Walls: one hedge block per off-path cell. Scaled just inside its cell so
       the seams read as clipped hedges and the sand path stays a clear corridor. */
    .maze-hedge{position:absolute;display:flex;align-items:center;justify-content:center;
      background:var(--maze-hedge);border-radius:24%;
      transform:scale(.9);
      box-shadow:inset 0 -0.6vmin 0 rgba(0,0,0,.14), inset 0 0.5vmin 0 rgba(255,255,255,.14)}
    .maze-motif{font-size:min(4.6vmin,24px);line-height:1;opacity:.95}
    .maze-stone{position:absolute;display:flex;align-items:center;justify-content:center;
      background:var(--maze-path);border-radius:26%;
      box-shadow:inset 0 -0.7vmin 0 rgba(0,0,0,.07);
      transition:background .2s ease}
    .maze-stone.maze-done{background:var(--maze-path-done)}
    /* The destination is the landmark and stays visually dominant. */
    .maze-goal{background:var(--maze-goal)}
    .maze-mark{font-size:min(9vmin,46px);line-height:1}
    .maze-goal .maze-mark{font-size:min(11vmin,54px)}
    .maze-token{
      position:absolute;
      transform:translate(-50%,-50%);
      display:flex;align-items:center;justify-content:center;
      padding:0;margin:0;border:none;background:transparent;
      font-size:min(11vmin,58px);line-height:1;
      cursor:grab;touch-action:none;
      filter:drop-shadow(0 0.6vmin 0.5vmin rgba(0,0,0,.28));
      transition:left .22s ease,top .22s ease;
      z-index:3;
    }
    .maze-token.maze-dragging{cursor:grabbing;transition:none}
    @media (prefers-reduced-motion: reduce){.maze-stone,.maze-token{transition:none}.maze-token.maze-dragging{transition:none}}

    /* task 255: bubble chrome from components.css (.ps-btn--icon + --secondary). */
    .retry-btn{position:absolute;top:2.6vmin;right:2.6vmin;font-size:5vmin;}
    #maze-feedback{min-height:6vmin;font-size:4.4vmin;font-weight:700;color:var(--green);text-align:center}
    @media (min-width:800px){#maze-prompt{font-size:36px}.maze-mark{font-size:34px}.maze-goal .maze-mark{font-size:40px}.maze-motif{font-size:20px}.maze-token{font-size:44px}#maze-feedback{font-size:28px}}
  </style>
</head>
<body>
  <div id="app">
    <button class="back-btn ps-back" id="maze-back" aria-label="Назад"><svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
    <div class="retry-btn-wrap">
      <button class="retry-btn ps-btn ps-btn--icon ps-btn--secondary" id="maze-retry" aria-label="Почни поново"><svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-8 8s3.58 8 8 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></button>
    </div>
    <div id="maze-prompt">Пронађи пут до куће</div>
    <div id="maze-board">
      <div id="maze-stage"></div>
    </div>
    <div id="maze-feedback" aria-live="polite"></div>
  </div>
  <script src="../data/serbian.js"></script>
  <script src="../shared/navigation.js"></script>
  <script src="../shared/celebration.js"></script>
  <script src="../shared/audio.js"></script>
  <script src="../shared/speech.js"></script>
  <script src="../shared/utils.js"></script>
  <script src="../games/maze.js"></script>
  <script src="../shared/audio-buses.js"></script>
  <script src="../shared/viewport.js"></script>
  <script src="../shared/input.js"></script>
  <script src="../shared/feedback.js"></script>
  <script src="../shared/motion.js"></script>
  <script src="../data/app-registry.js"></script>
  <script src="../shared/main.js"></script>
</body>
</html>
