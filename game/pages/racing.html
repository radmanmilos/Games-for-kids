<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Мала тркачица: Пустоловина</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏎️</text></svg>">
    <link rel="stylesheet" href="../shared/accessibility.css">
    <style>
        @font-face {
            font-family: 'Fredoka';
            font-style: normal;
            font-weight: 100 700;
            font-display: swap;
            src: url('../assets/fonts/fredoka-latin.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
            font-family: 'Fredoka';
            font-style: normal;
            font-weight: 100 700;
            font-display: swap;
            src: url('../assets/fonts/fredoka-latin-ext.woff2') format('woff2');
            unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Fredoka', 'Comic Sans MS', cursive, sans-serif; }
        #racing-game { position: fixed; inset: 0; overflow: hidden; background: #5c94fc; }
        #racing-canvas { width: 100%; height: 100%; display: block; }
        /* --- HUD --- */
        #racing-score {
            position: absolute; top: 12px; left: 16px; z-index: 10;
            background: #FFF8ED; color: #4A3F6B; font-weight: 700; font-size: 18px;
            padding: 8px 16px; border-radius: 14px; border: 4px solid #FFD23F;
            box-shadow: 0 5px 0 rgba(0,0,0,0.25); pointer-events: none; min-width: 110px;
        }
        #racing-world-name {
            position: absolute; top: 12px; right: 16px; z-index: 10;
            background: #FFF8ED; color: #4A3F6B; font-weight: 700; font-size: 17px;
            padding: 6px 16px; border-radius: 14px; border: 4px solid #FFD23F;
            box-shadow: 0 5px 0 rgba(0,0,0,0.25); pointer-events: none;
        }
        #racing-music-btn {
            position: absolute; top: 12px; right: 84px; z-index: 10;
            width: 58px; height: 58px; border-radius: 50%; border: 4px solid #fff;
            background: #4A3F6B; color: #fff; font-size: 24px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 5px 0 rgba(0,0,0,0.25); cursor: pointer;
        }
        #racing-music-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.25); }
        #racing-music-btn.off { background: #8a82a8; }
        #racing-worlds-btn {
            position: absolute; top: 12px; right: 152px; z-index: 10;
            width: 58px; height: 58px; border-radius: 50%; border: 4px solid #fff;
            background: #4A3F6B; color: #fff; font-size: 26px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 5px 0 rgba(0,0,0,0.25); cursor: pointer;
        }
        #racing-worlds-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.25); }
        /* --- Back button --- */
        #racing-back {
            position: absolute; top: 4vmin; left: 4vmin; z-index: 20;
            width: 12vmin; height: 12vmin; border-radius: 50%; border: none;
            background: rgba(74, 63, 107, 0.85); color: #fff; font-size: 6vmin;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 1vmin 0 rgba(0,0,0,0.2); cursor: pointer;
        }
        #racing-back:active { transform: scale(0.9) translateY(3px); }
        /* --- Page title --- */
        #racing-title {
            position: absolute; top: 2vmin; left: 50%; transform: translateX(-50%);
            margin: 0; font-size: 5vmin; color: #FFF8ED;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.3); pointer-events: none; z-index: 5; white-space: nowrap;
        }
        /* --- Touch controls --- */
        #racing-controls {
            position: absolute; left: 0; right: 0; bottom: 0; z-index: 12;
            display: flex; justify-content: space-between; align-items: flex-end;
            padding: 10px 18px calc(14px + env(safe-area-inset-bottom));
            pointer-events: none;
        }
        #racing-controls .racing-btn {
            pointer-events: auto;
            width: 120px; height: 120px; border-radius: 50%;
            border: 6px solid #fff; display: flex; align-items: center; justify-content: center;
            font-size: 50px; color: #fff; box-shadow: 0 8px 0 rgba(0,0,0,0.3), inset 0 -4px 0 rgba(0,0,0,0.2);
            cursor: pointer; text-shadow: 3px 3px 0 rgba(0,0,0,0.3); font-family: inherit;
        }
        #racing-controls .racing-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 rgba(0,0,0,0.3); }
        #racing-left { background: #e52521; }
        #racing-right { background: #fbd000; color: #4A3F6B; }
        @media (max-width: 560px) {
            #racing-controls .racing-btn { width: 100px; height: 100px; font-size: 40px; }
        }
        /* --- Character picker modal --- */
        #racing-char-modal {
            display: none; position: absolute; inset: 0; z-index: 35;
            background: rgba(74, 63, 107, 0.85); flex-direction: column;
            justify-content: center; align-items: center; padding: 4vmin;
        }
        #racing-char-modal.show { display: flex; }
        #racing-char-modal h2 { color: #FFF8ED; font-size: 26px; margin: 0 0 3vmin; text-align: center; text-shadow: 2px 2px 0 rgba(0,0,0,0.3); }
        #racing-char-grid {
            display: grid; grid-template-columns: repeat(2, minmax(120px, 1fr));
            gap: 16px; width: 100%; max-width: 360px;
        }
        .racing-char-btn {
            border: 4px solid #fff; border-radius: 18px; background: #FFF8ED;
            color: #4A3F6B; font-family: inherit; font-weight: 700;
            font-size: 15px; padding: 12px 8px; cursor: pointer;
            box-shadow: 0 5px 0 rgba(0,0,0,0.25); display: flex;
            flex-direction: column; align-items: center; gap: 8px; line-height: 1.1;
        }
        .racing-char-btn img { width: 64px; height: 78px; object-fit: contain; }
        .racing-char-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.25); }
        /* --- Worlds picker modal --- */
        #racing-worlds-modal {
            display: none; position: absolute; inset: 0; z-index: 30;
            background: rgba(74, 63, 107, 0.72); flex-direction: column;
            justify-content: center; align-items: center; padding: 4vmin;
        }
        #racing-worlds-modal.show { display: flex; }
        #racing-worlds-modal h2 { color: #FFF8ED; font-size: 26px; margin: 0 0 3vmin; text-align: center; text-shadow: 2px 2px 0 rgba(0,0,0,0.3); }
        #racing-worlds-grid {
            display: grid; grid-template-columns: repeat(3, minmax(100px, 1fr));
            gap: 12px; width: 100%; max-width: 360px; overflow: auto; max-height: 60%;
        }
        .racing-world-btn {
            border: 4px solid #fff; border-radius: 14px; background: #FFF8ED;
            color: #4A3F6B; font-family: inherit; font-weight: 700;
            font-size: 15px; padding: 12px 8px; cursor: pointer;
            box-shadow: 0 5px 0 rgba(0,0,0,0.25); text-align: center;
        }
        .racing-world-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.25); }
        #racing-worlds-close {
            margin-top: 3vmin; border: 4px solid #fff; border-radius: 50vmin;
            background: #FF6F91; color: #fff; font-family: inherit; font-weight: 700;
            font-size: 17px; padding: 12px 36px; box-shadow: 0 5px 0 rgba(0,0,0,0.25); cursor: pointer;
        }
        #racing-worlds-close:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.25); }
        /* --- Win modal --- */
        #racing-win-modal {
            display: none; position: absolute; inset: 0; z-index: 20;
            background: rgba(74, 63, 107, 0.85); flex-direction: column;
            justify-content: center; align-items: center; padding: 4vmin;
        }
        #racing-win-modal.show { display: flex; }
        #racing-win-modal h1 {
            font-size: 24px; color: #FFF8ED; margin: 0 0 24px; text-align: center;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.35); white-space: pre-line;
        }
        #racing-win-score {
            color: #FFD23F; font-size: 20px; font-weight: 700; margin: 0 0 24px;
        }
        .adv-play-again-btn {
            padding: 16px 40px; font-size: 18px; font-family: 'Fredoka', sans-serif;
            font-weight: 700; border-radius: 50vmin; background: #FFD23F;
            color: #4A3F6B; border: 5px solid #fff; box-shadow: 0 8px 0 rgba(0,0,0,0.3); cursor: pointer;
        }
        .adv-play-again-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 rgba(0,0,0,0.3); }
        .racing-modal-btn-group { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    </style>
</head>
<body>
<div id="racing-game">
    <button class="adv-back" id="racing-back" aria-label="Назад"></button>
    <h1 id="racing-title">🏎️ Мала тркачица</h1>

    <div id="racing-score">Поени: 0</div>
    <div id="racing-world-name">Ливада</div>
    <button id="racing-worlds-btn" aria-label="Светови">🌍</button>
    <button id="racing-music-btn" aria-label="Музика">🔊</button>

    <div id="racing-win-modal">
        <h1 id="racing-win-title">СВЕТ ПРЕЂЕН!</h1>
        <div id="racing-win-score"></div>
        <div class="racing-modal-btn-group">
            <button class="adv-play-again-btn" id="racing-restart-btn">Играј поново! 🔄</button>
            <button class="adv-play-again-btn" id="racing-change-btn">Промени! 🚗</button>
        </div>
    </div>

    <div id="racing-worlds-modal">
        <h2>🌍 Светови</h2>
        <div id="racing-worlds-grid"></div>
        <button id="racing-worlds-close">Затвори</button>
    </div>

    <div id="racing-char-modal">
        <h2>Ко путује?</h2>
        <div id="racing-char-grid"></div>
    </div>

    <canvas id="racing-canvas"></canvas>

    <div id="racing-controls">
        <div class="racing-btn" id="racing-left" aria-label="Налево">◀</div>
        <div class="racing-btn" id="racing-right" aria-label="Надесно">▶</div>
    </div>
</div>

<script src="../games/racing-config.js"></script>
<script src="../games/racing.js"></script>
<script src="../shared/main.js"></script>
</body>
</html>
