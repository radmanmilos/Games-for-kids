<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#4A3F6B">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Памтилица животиња — Петрин свет</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>">
  <link rel="stylesheet" href="../styles/viewport.css">
    <link rel="stylesheet" href="../styles/design-tokens.css">
  <link rel="stylesheet" href="../styles/learning-stage.css">
    <link rel="stylesheet" href="../styles/shell.css">
    <link rel="stylesheet" href="../shared/accessibility.css">
    <link rel="stylesheet" href="../styles/components.css">
  <style>
    /* V12 (spec §30 / §42.3) — Memory card refinement.
       Keep the purple identity and the matching mechanic; make the cards read as
       actual cards (near-square, strong central back symbol, inner padding, clear
       flip, matched settles) and stop the short-landscape difficulty controls
       falling below the fold — without shrinking the cards to fit. */
    :root{ --cream:#FFF8ED; --plum:#4A3F6B; --plum-soft:#655A8C; --green:#67C971; --yellow:#FFD23F; }
    html, body{ height:100%; }
    body{
      font-family:'Fredoka', sans-serif; margin:0; background:var(--cream); color:var(--plum);
      display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden;
    }

    /* Header (spec §8.1 / §42.3): back + title are flex siblings of the shared
       `.ps-header` row (V2.10), so the title can never run under the back button. */
    .memory-header{ flex:0 0 auto; box-sizing:border-box; padding: calc(var(--ps-safe-top) + 1rem) 1rem 0; gap:2vmin; }
    .memory-header .ps-title{ flex:1 1 auto; min-width:0; margin:0; text-align:center; }
    .back-btn{ flex:0 0 auto; width:clamp(44px,11vmin,64px); height:clamp(44px,11vmin,64px); border:0; border-radius:50%; background:var(--plum); color:#fff; font-size:clamp(20px,5vmin,30px); display:flex; align-items:center; justify-content:center; }
    #memoryStatus{ flex:0 0 auto; text-align:center; font-size:clamp(14px,2.6vmin,22px); font-weight:600; color:var(--plum-soft); margin:.25rem 0 .5rem; display:none; }

    /* Board area: takes the remaining height and centres a grid of near-square
       cards. `container-type:size` lets the grid derive its cell size from BOTH the
       available width and height, so cards stay square instead of stretching into
       broad slabs. A 64px floor keeps them tappable; when the board cannot fit
       (e.g. 16 cards in short landscape) the area scrolls rather than shrinking the
       cards into unreadable squares — "do not make cards tiny to fit all of them". */
    #board-wrap{ flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; overflow:auto; container-type:size; padding:clamp(4px,1.2vmin,12px) 1rem; }
    #board{
      --gap:clamp(6px,1.6vmin,14px); --cols:4; --rows:4; --max-cell:150px;
      --cell:clamp(64px,
        min(
          calc((100cqw - (var(--cols) - 1) * var(--gap)) / var(--cols)),
          calc((100cqh - (var(--rows) - 1) * var(--gap)) / var(--rows))
        ), var(--max-cell));
      width:calc(var(--cols) * var(--cell) + (var(--cols) - 1) * var(--gap));
      display:grid; grid-template-columns:repeat(var(--cols), minmax(0, 1fr)); grid-auto-rows:var(--cell); gap:var(--gap);
    }
    .card{
      position:relative; border:0; border-radius:clamp(10px,2.4vmin,18px); padding:0; background:#9B6DFF;
      color:#fff; cursor:pointer; user-select:none; perspective:600px; aspect-ratio:1; container-type:size;
      box-shadow:0 2px 0 rgba(74,63,107,.18), 0 4px 10px rgba(74,63,107,.14);
      transition:transform .12s ease;
    }
    .card:active{ transform:scale(.97); }
    .card-inner{ position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .3s ease; }
    .card.flipped .card-inner, .card.matched .card-inner{ transform:rotateY(180deg); }
    /* Inner padding so the symbol never touches the card edge. */
    .card-face{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; border-radius:inherit; backface-visibility:hidden; padding:10%; box-sizing:border-box; }
    .card-back{ background:radial-gradient(circle at 30% 25%, #C9A6FF, #9B6DFF 68%, #7B4FD8); box-shadow: inset 0 0 0 clamp(2px,0.6vmin,4px) rgba(255,255,255,.4), inset 0 0 0 clamp(5px,1.6vmin,10px) rgba(255,255,255,.18); }
    /* Strong central back symbol — sized from the card (cqmin), not a fixed px. */
    .card-back::before{ content:'🃏'; font-size:46cqmin; line-height:1; filter:drop-shadow(0 3px 3px rgba(0,0,0,.3)); }
    .card-front{ background:#fff; transform:rotateY(180deg); font-size:52cqmin; line-height:1; }
    /* Clear flip state: a face-up, not-yet-matched card gets a violet inner ring
       on top of the V6.2 Petrin Glow (accessibility.css). */
    .card.flipped:not(.matched) .card-front{ box-shadow: inset 0 0 0 clamp(2px,.5vmin,4px) rgba(155,109,255,.5); }
    /* Matched settles: dim + green front + a one-shot settle animation, and it can
       never be tapped again. */
    .card.matched{ opacity:.55; pointer-events:none; animation:matchedSettle .3s ease-out; }
    .card.matched .card-front{ background:#EAF7EC; box-shadow: inset 0 0 0 clamp(3px,.8vmin,5px) var(--green); }
    @keyframes matchedSettle{ from{ transform:scale(1.06); } to{ transform:scale(1); } }
    .match-pop{ position:absolute; z-index:5; font:700 clamp(20px,4.4vmin,40px) 'Fredoka',sans-serif; color:#FF6F91; text-shadow:0 2px 0 #fff, 0 4px 8px rgba(0,0,0,.2); pointer-events:none; }

    /* Bottom bar: restart + difficulty live in ONE row so the difficulty controls
       can never fall below the fold in short landscape (spec §30/§42.3). */
    #controls{ flex:0 0 auto; display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:clamp(8px,2vmin,18px); padding:clamp(6px,1.2vmin,12px) 1rem calc(var(--ps-safe-bottom) + clamp(8px,1.6vmin,16px)); }
    .diff-group{ display:flex; gap:clamp(6px,1.6vmin,12px); }
    .next-btn{ width:clamp(44px,10vmin,60px); height:clamp(44px,10vmin,60px); border-radius:50%; border:none; background:var(--yellow); color:var(--plum); font-size:clamp(22px,5vmin,30px); display:flex; align-items:center; justify-content:center; box-shadow:0 .5vmin 0 rgba(0,0,0,.15); cursor:pointer; }
    .next-btn:active{ transform:scale(.9) translateY(2px); }
    .diff-btn{ padding:.55em 1.1em; border-radius:999px; border:0; font-weight:700; font-size:clamp(14px,3.4vmin,20px); cursor:pointer; color:#302741; background:#E7E0F5; box-shadow:0 .5vmin 0 rgba(0,0,0,.12); }
    .diff-btn[data-diff="easy"]{ background:var(--green); }
    .diff-btn[data-diff="medium"]{ background:var(--yellow); color:var(--plum); }
    .diff-btn[data-diff="standard"]{ background:#FF6F91; }
    .diff-btn[aria-pressed="true"]{ outline:4px solid var(--plum); outline-offset:2px; }
    .diff-btn:active{ transform:translateY(3px); }

    /* Short landscape (844x390): compress the chrome so the whole board + the
       difficulty controls fit without scrolling. */
    @media (max-height:520px){
      .memory-header{ padding-top: calc(var(--ps-safe-top) + .35rem); }
      #board-wrap{ padding-top:2px; padding-bottom:2px; }
      #controls{ padding-top:.3rem; padding-bottom: calc(var(--ps-safe-bottom) + .4rem); gap:clamp(6px,1.4vmin,12px); }
    }
  </style>
</head>
<body>
  <header class="ps-header memory-header">
    <button class="back-btn" aria-label="Назад на игре"><svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
    <h1 class="ps-title">Памтилица животиња</h1>
  </header>
  <div id="memoryStatus" aria-live="polite"></div>
  <div id="board-wrap"><div id="board" aria-live="polite"></div></div>
  <div id="controls">
    <button id="restart" class="next-btn" aria-label="Почни поново" title="Почни поново">↻</button>
    <div class="diff-group" role="group" aria-label="Тежина">
      <button class="diff-btn" data-diff="easy" aria-pressed="true">Лако</button>
      <button class="diff-btn" data-diff="medium" aria-pressed="false">Средње</button>
      <button class="diff-btn" data-diff="standard" aria-pressed="false">Тешко</button>
    </div>
  </div>

  <script src="../data/serbian.js"></script>
  <script src="../shared/navigation.js"></script>
  <script src="../shared/celebration.js"></script>
  <script src="../shared/audio.js"></script>
  <script src="../shared/audio-buses.js"></script>
  <script src="../shared/speech.js"></script>
  <script src="../games/animal_memory.js"></script>
</body>
</html>
