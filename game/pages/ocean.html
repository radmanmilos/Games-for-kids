<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#4A3F6B">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Океан: Пустоловина</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐟</text></svg>">
    <link rel="stylesheet" href="../shared/adventure.css">
    <link rel="stylesheet" href="../styles/viewport.css">
    <link rel="stylesheet" href="../styles/design-tokens.css">
    <link rel="stylesheet" href="../styles/shell.css">
    <link rel="stylesheet" href="../shared/accessibility.css">
    <style>
        /* V2.7 — shared header geometry (spec §42.10: fix the portrait top
           chrome/title overlap and restore shell hierarchy; keep the water and
           the exploration feel). The title was position:absolute; top:2vmin
           (ignoring --ps-safe-top) and collided with the HUD in every portrait
           orientation (measured: 390×844 title∩worlds 545px², title∩score
           244px², back∩music 1305px²; 768×1024 title∩music 260px²; both
           landscapes were clean). It now sits in the .ps-header flow row — back
           stays on its corner anchor, the row reserves 16vmin per side — and the
           band is as tall as the corner control ACTUALLY is: accessibility.css
           floors every button at 64px, which beats 12vmin on phones (46.8 < 64).
           The header is an absolute overlay so the full-bleed canvas keeps its
           space (this world's water depth is the point). The HUD trio keeps its
           offsets and z-order but drops below the shell band in portrait, where
           the five chrome items (64+64+64+58+161px) cannot fit one 390px row.
           adventure.css is untouched, so dino/space/driving are unaffected. */
        .ps-header{ position:absolute; top:0; left:0; right:0; width:auto; padding:0 16vmin; justify-content:center; pointer-events:none; }
        .ps-header .adv-back{ pointer-events:auto; }
        #adv-title{
            position:static; top:auto; left:auto; transform:none;
            margin:calc(var(--ps-safe-top) + 4vmin) 0 1vmin;
            min-height:max(12vmin, 64px); line-height:max(12vmin, 64px);
        }
        @media (orientation:portrait){
            #adv-score, #adv-worlds-btn, #adv-music-btn{
                top:calc(var(--ps-safe-top) + 4vmin + max(12vmin, 64px) + 4px);
            }
        }
    </style>
</head>
<body>
<div id="adv-game">
    <div class="ps-header">
        <button class="adv-back" id="ocean-back" aria-label="Назад"><svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
        <h1 id="adv-title">Океан</h1>
    </div>

    <div id="adv-score">
        СВЕТ <span id="adv-level">1</span><br>
        <span id="adv-collect-emoji">🐚</span> <span id="adv-coin-count">0</span><br>
        <span class="sb-small" id="adv-world-name">Корални гребен</span>
    </div>
    <button id="adv-worlds-btn" aria-label="Светови">🌍</button>
    <button id="adv-music-btn" aria-label="Музика">🔊</button>

    <div id="adv-win-modal">
        <h1 id="adv-win-title">СВЕТ ПРЕЂЕН!</h1>
        <button class="adv-play-again-btn" id="adv-modal-btn">СЛЕДЕЋИ СВЕТ! 🚀</button>
    </div>

    <div id="adv-worlds-modal">
        <h2>🌍 Светови</h2>
        <div id="adv-worlds-grid"></div>
        <button id="adv-worlds-close">Затвори</button>
    </div>

    <canvas id="adv-canvas"></canvas>

    <div id="adv-controls" class="adv-fly-controls">
        <div class="adv-d-pad adv-pad-horizontal">
            <div class="adv-btn adv-btn-left" data-adv="left">◀</div>
            <div class="adv-btn adv-btn-right" data-adv="right">▶</div>
        </div>
        <div class="adv-d-pad adv-pad-vertical">
            <div class="adv-btn adv-btn-up" data-adv="up">▲</div>
            <div class="adv-btn adv-btn-down" data-adv="down">▼</div>
        </div>
    </div>
</div>

<script src="../data/serbian.js"></script>
<script src="../games/adventure-modes.js"></script>
<script src="../games/adventure-music.js"></script>
<script src="../games/adventure.js"></script>
<script src="../games/ocean.js"></script>
<script src="../shared/audio-buses.js"></script>
    <script src="../shared/viewport.js"></script>
    <script src="../shared/input.js"></script>
    <script src="../shared/feedback.js"></script>
    <script src="../shared/motion.js"></script>
    <script src="../data/app-registry.js"></script>
    <script src="../shared/main.js"></script>
</body>
</html>
