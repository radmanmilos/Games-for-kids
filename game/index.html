<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Петрин свет</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌈</text></svg>">
<style>
  :root{
    --cream:#FFF8ED;
    --sky:#4FC3F7;
    --sky-deep:#2FA6DA;
    --yellow:#FFD23F;
    --green:#67C971;
    --pink:#FF6F91;
    --plum:#4A3F6B;
    --plum-soft:#655A8C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden; overscroll-behavior:none; touch-action:manipulation;
    background:var(--cream);
    font-family:'Fredoka', sans-serif;
  }
  #app{position:fixed; inset:0; overflow:hidden;}
  .screen{
    position:absolute; inset:0; display:none;
    flex-direction:column; align-items:center; justify-content:center;
    overflow:auto; -webkit-overflow-scrolling: touch;
  }
  .screen.active{display:flex;}

  /* V21 (§39): ambient blobs are static decoration — they communicate nothing
     and ran a forever drift+scale loop, so the motion was removed; the blobs
     themselves stay as the calm background for every screen. */
  .blob{
    position:absolute; border-radius:50%; opacity:.35; filter:blur(2px);
  }

  /* ---------- HUB ---------- */
  #hub-title{
    position:absolute; top:6%; font-size:8vmin; margin:0; color:var(--plum);
    text-shadow: 0 3px 0 rgba(255,255,255,.6);
  }
  /* responsive grid that grows/shrinks and wraps; allows scrolling if many buttons */
  .hub-grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
    gap: clamp(12px, 4vmin, 6vmin);
    align-items:center; justify-items:center;
    width: min(90vmin, 90%);
    margin: 18vh auto 0;
    padding: 2vmin 2vmin 6vmin;
  }
  /* adaptive circular buttons — task 255: bubble chrome unified (white ring,
     gloss, solid depth shadow, translateY press). Per-game gradient HUE stays
     (user-confirmed 2026-10-18: tiles keep their colour identity). */
  .hub-btn{
    width: clamp(72px, 22vmin, 180px);
    height: clamp(72px, 22vmin, 180px);
    border-radius:50%; border:5px solid #fff;
    display:flex; align-items:center; justify-content:center;
    font-size: clamp(28px, 9vmin, 88px); cursor:pointer;
    box-shadow: 0 8px 0 rgba(0,0,0,.22),
                inset 0 -4px 0 rgba(0,0,0,.10),
                inset 0 5px 6px rgba(255,255,255,.55);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .hub-btn:active{ transform: translateY(4px);
    box-shadow: 0 3px 0 rgba(0,0,0,.22),
                inset 0 -4px 0 rgba(0,0,0,.10),
                inset 0 5px 6px rgba(255,255,255,.4); }
  .hub-btn[hidden]{ display:none; }
  .hub-btn.sky{ background: radial-gradient(circle at 35% 30%, #7FDBFF, var(--sky)); }
  .hub-btn.pink{ background: radial-gradient(circle at 35% 30%, #FF9FB6, var(--pink)); }
  .hub-btn.matching{ background: radial-gradient(circle at 35% 30%, #C9A6FF, #9B6DFF); }
  .matching-icon{display:inline-flex;flex-direction:column;align-items:center;font-size:.58em;line-height:.72;}
  .hub-btn.kitty{ background: radial-gradient(circle at 35% 30%, #FFB6D0, #FF7FA8); }
  .hub-btn img{ width:78%; height:78%; object-fit:contain; pointer-events:none; }
  .hub-btn.green{ background: radial-gradient(circle at 35% 30%, #A5E5A0, var(--green)); }
  .hub-btn.ghost{
    background:transparent; border:.8vmin dashed var(--plum-soft); opacity:.55;
    box-shadow:none; cursor:default;
  }
  .hub-btn.ghost:active{ transform:none; }

  /* ---------- HUB LANDING (two group tiles) ---------- */
  .hub-tiles{
    display:flex; gap: clamp(24px, 8vmin, 12vmin);
    justify-content:center; align-items:center; flex-wrap:wrap;
    width: min(92vmin, 92%); margin: 22vh auto 0; padding-bottom:4vmin;
  }
  .hub-tile{
    width: clamp(150px, 34vmin, 320px); height: clamp(150px, 34vmin, 320px);
    border-radius:12%; border:5px solid #fff; cursor:pointer; color:white;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.5vmin;
    box-shadow: 0 8px 0 rgba(0,0,0,.22),
                inset 0 -4px 0 rgba(0,0,0,.10),
                inset 0 5px 6px rgba(255,255,255,.5);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .hub-tile:active{ transform: translateY(4px);
    box-shadow: 0 3px 0 rgba(0,0,0,.22),
                inset 0 -4px 0 rgba(0,0,0,.10),
                inset 0 5px 6px rgba(255,255,255,.35); }
  .hub-tile .tile-emoji{ font-size: clamp(56px, 17vmin, 160px); line-height:1; }
  .hub-tile .tile-emojis{
    display:grid; grid-template-columns:1fr 1fr; gap:.4em;
    font-size: clamp(30px, 9.5vmin, 88px); line-height:1; text-align:center;
  }
  .hub-tile .tile-label{ font-size: clamp(30px, 7.5vmin, 72px); font-weight:700; letter-spacing:.05em; text-shadow:0 3px 0 rgba(0,0,0,.18); }
  .hub-tile.tile-games{ background: radial-gradient(circle at 35% 30%, #FF9FB6, var(--pink)); }
  .hub-tile.tile-learning{ background: radial-gradient(circle at 35% 30%, #A5E5A0, var(--green)); }
  .hub-tile:active{ transform: scale(.94) translateY(4px); }
  .hub-sub-title{
    position:absolute; top:6%; font-size:7vmin; margin:0; color:var(--plum);
    text-shadow: 0 3px 0 rgba(255,255,255,.6); pointer-events:none;
  }
  /* sub-hub screens: grid scrolls from the top, clears the title + back button */
  #hub-games, #hub-learning{ justify-content:flex-start; }
  /* V20 (§38): a flat 24vh left a 116px dead band under the sub-hub title on a
     phone (136px on a tablet) while the learning grid scrolled off the bottom.
     The title sits at top:6% but its box is vmin-sized, so the offset tracks
     BOTH (6vh + the ~10vmin line box + a constant gap) instead of guessing. */
  #hub-games .hub-grid, #hub-learning .hub-grid{ margin: calc(6vh + 10vmin + 40px) auto 0; }
  /* V20 (§38) phone portrait: the two group tiles sat at their 150px clamp floor
     (34vmin = 132.6 < 150) under a 22vh offset, leaving a 335px - 40% - void
     between the title and the only two controls on the screen. Stack the pair and
     size it from the height the phone has; 22vh is the cap that keeps short phones
     clear of the title and the parent lock. Landscape/tablet keep the row. */
  @media (orientation:portrait) and (max-width:600px){
    .hub-tiles{ flex-direction:column; margin:0 auto; }
    .hub-tile{ width:clamp(150px, 22vh, 240px); height:clamp(150px, 22vh, 240px); }
    .hub-tile .tile-emoji{ font-size: clamp(56px, 21vmin, 160px); }
    .hub-tile .tile-emojis{ font-size: clamp(30px, 11.5vmin, 88px); }
    .hub-tile .tile-label{ font-size: clamp(30px, 9.5vmin, 72px); }
  }
  /* Short viewports (landscape phones): a 24vh top margin plus only 2 columns
     pushed the last row below the fold, which hid the racing3d button entirely
     (measured: bottom=639 in a 390px viewport). Three narrower columns fit.
     task 254: with 10 game buttons the 90vmin (351px) grid still only fit 3
     columns and fastcat landed in row 4 (bottom=493 in a 390px viewport), so
     widen to 32rem — 4 columns keep all 10 buttons inside 3 rows. */
  @media (max-height: 560px){
    #hub-games .hub-grid, #hub-learning .hub-grid{
      margin: 14vh auto 0;
      width: min(94%, 32rem);
      grid-template-columns: repeat(auto-fit, minmax(6rem, 1fr));
      padding-bottom: 3vmin;
    }
    .hub-btn{ width: clamp(64px, 20vmin, 140px); height: clamp(64px, 20vmin, 140px);
              font-size: clamp(26px, 8vmin, 70px); }
  }

  /* ---------- BACK BUTTON (shared) ---------- */
  /* task 255: chrome from components.css (.ps-back bubble); position only. */
  .back-btn{
    position:absolute; top:4vmin; left:4vmin; z-index:20;
  }

  /* ---------- ANIMALS GAME ---------- */
  #game-animals .card-wrap{
    display:flex; flex-direction:column; align-items:center; gap:6vmin;
  }
  .animal-card{
    width:52vmin; height:52vmin; border-radius:12%;
    display:flex; align-items:center; justify-content:center;
    font-size:30vmin; cursor:pointer;
    box-shadow: 0 2vmin 0 rgba(0,0,0,.12), 0 3vmin 5vmin rgba(0,0,0,.15);
    transition: transform .18s cubic-bezier(.34,1.56,.64,1), background .3s;
  }
  .animal-card.bounce{ transform: scale(1.15) rotate(-4deg); }
  .next-btn{
    width:14vmin; height:14vmin; border-radius:50%; border:none;
    background:var(--yellow); color:var(--plum); font-size:7vmin;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 1vmin 0 rgba(0,0,0,.15); cursor:pointer;
  }
  .next-btn:active{ transform:scale(.9) translateY(3px); }

  /* ---------- SHAPES GAME ---------- */
  #game-shapes .stage{ position:relative; width:100%; height:100%; }
  .slot, .piece{
    position:absolute; width:20vmin; height:20vmin;
    transform: translate(-50%,-50%);
  }
  .slot{
    top:26%; border:.9vmin dashed rgba(74,63,107,.4); border-radius:14%;
    background: rgba(255,255,255,.35);
  }
  .slot.circle{ border-radius:50%; }
  .slot.triangle{ border:none; clip-path:polygon(50% 0%, 0% 100%, 100% 100%); background:rgba(74,63,107,.2); filter:drop-shadow(0 .4vmin 0 rgba(74,63,107,.35)); }
  .slot.star{ border:none; clip-path:polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); background:rgba(74,63,107,.2); filter:drop-shadow(0 .4vmin 0 rgba(74,63,107,.35)); }
  .piece{
    top:72%; cursor:grab; touch-action:none;
    box-shadow: 0 1vmin 0 rgba(0,0,0,.15);
    transition: transform .3s cubic-bezier(.34,1.56,.64,1);
    z-index:5;
  }
  .piece.dragging{ transition:none; z-index:10; cursor:grabbing; }
  .shape-fill.circle{ border-radius:50%; }
  .shape-fill.square{ border-radius:14%; }
  .shape-fill.triangle{
    clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    border-radius:6%;
  }
  .shape-fill.star{
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  }
  /* ---------- COLORING GAME ---------- */
  #game-coloring .coloring-wrap{
    display:flex; flex-direction:column; align-items:center; gap:2.5vmin;
    width:100%; height:100%;
  }
  .coloring-ref-wrap{
    display:flex; flex-direction:column; align-items:center; gap:1vmin;
    margin-top:2vh;
  }
  .coloring-ref{
    width:min(24vmin, 16vh); height:auto; aspect-ratio:1;
    background:white; border-radius:12%; padding:1vmin;
    box-shadow:0 1vmin 0 rgba(0,0,0,.12), 0 2vmin 4vmin rgba(0,0,0,.15);
    pointer-events:none;
  }
  .coloring-ref-label{
    font-size:2.6vmin; font-weight:600; color:var(--plum-soft); margin:0;
  }
  .coloring-ref .coloring-region{ stroke-width:1; }
  .coloring-svg{
    width:min(58vmin, 40vh); height:auto; aspect-ratio:1;
    background:white; border-radius:6%;
    box-shadow:0 2vmin 0 rgba(0,0,0,.12), 0 3vmin 5vmin rgba(0,0,0,.15);
    touch-action:manipulation;
  }
  .coloring-region{
    fill:#FFF8ED; stroke:var(--plum); stroke-width:1.4; stroke-linejoin:round; stroke-linecap:round;
    cursor:pointer;
  }
  .coloring-region:active{ opacity:.85; }
  .coloring-region.ok{ pointer-events:none; }
  .coloring-name{
    font-size:4.5vmin; font-weight:600; color:var(--plum);
    margin:0;
  }
  .coloring-palette{
    display:flex; gap:2vmin; flex-wrap:wrap; justify-content:center;
    max-width:90vmin;
    padding-bottom:4vmin;
  }
  .coloring-swatch{
    width:9vmin; height:9vmin; border-radius:50%; border:none;
    box-shadow:0 1vmin 0 rgba(0,0,0,.15); cursor:pointer;
    transition: transform .12s ease;
  }
  .coloring-swatch.selected{
    transform: scale(1.15);
    outline: .8vmin solid var(--plum); outline-offset: .8vmin;
  }
  .coloring-swatch:active{ transform: scale(.9) translateY(3px); }
</style>
<link rel="stylesheet" href="shared/accessibility.css">
</head>
<body>
<div id="app">

  <!-- HUB LANDING -->
  <div class="screen active" id="hub">
    <div class="blob" style="width:20vmin;height:20vmin;background:var(--yellow);top:10%;left:8%;"></div>
    <div class="blob" style="width:14vmin;height:14vmin;background:var(--green);bottom:14%;right:10%;"></div>
    <div class="blob" style="width:10vmin;height:10vmin;background:var(--pink);bottom:8%;left:14%;"></div>
    <h1 id="hub-title">🌈 Петрин свет</h1>
    <div class="hub-tiles">
      <button class="hub-tile tile-learning" data-go="hub-learning" aria-label="Учење"><span class="tile-emojis"><span>🏫</span><span>📝</span><span>🎹</span><span>🎨</span></span><span class="tile-label">УЧЕЊЕ</span></button>
      <button class="hub-tile tile-games" data-go="hub-games" aria-label="Игре"><span class="tile-emoji">🎮</span><span class="tile-label">ИГРЕ</span></button>
    </div>
    <div style="width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-top:2vmin;gap:8px;">
      <!-- Parent-only actions (offline download, update check, reset progress, audio
           test) live in pages/parent.html behind the lock. They used to be duplicated
           here on the child-facing hub, which put a big download button and a ZIP link
           in front of children; navigation.js guards the old ids with `if (!btn) return`. -->
      <button class="hub-btn" data-go="game-parent" aria-label="За родитеље" title="За родитеље" style="width:60px;height:60px;font-size:24px;position:absolute;bottom:4vmin;right:4vmin;">🔒</button>
    </div>
  </div>

  <!-- HUB GAMES -->
  <div class="screen" id="hub-games">
    <button class="back-btn ps-back" data-go="hub" aria-label="Назад"><svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
    <h2 class="hub-sub-title">🎮 ИГРЕ</h2>
    <div class="hub-grid">
      <button class="hub-btn kitty" data-go="game-explorer" aria-label="Мала истраживачица"><img src="assets/images/explorer_kitty/01_idle_right.png" alt="Мала истраживачица"></button>
      <button class="hub-btn green" data-go="game-driving" aria-label="Возила">🚗</button>
      <button class="hub-btn sky" data-go="game-ocean" aria-label="Океан">🐟</button>
      <button class="hub-btn green" data-go="game-dino" aria-label="Дино">🦕</button>
      <button class="hub-btn pink" data-go="game-space" aria-label="Свемир">🚀</button>
      <button class="hub-btn matching" data-go="game-candy" aria-label="Слагалица бомбона"><span class="matching-icon">🐱🐶<br>🐶🐱</span></button>
      <button class="hub-btn matching" data-go="game-memory" aria-label="Памтилица">🃏</button>
      <button class="hub-btn" data-go="game-puzzle" aria-label="Слагалице">🧩</button>
      <button class="hub-btn sky" data-go="game-racing" aria-label="Мала тркачица" hidden>🏎️</button>
      <button class="hub-btn sky" data-go="game-racing3d" aria-label="Мала тркачица 3Д">🏎️💨</button>
      <button class="hub-btn sky" data-go="game-fastcat" aria-label="Брзи мачак">🐱💨</button>
      <button class="hub-btn green" data-go="game-cat-forest" aria-label="Мачја шума">🐱🌲</button>
    </div>
  </div>

  <!-- HUB LEARNING -->
  <div class="screen" id="hub-learning">
    <button class="back-btn ps-back" data-go="hub" aria-label="Назад"><svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
    <h2 class="hub-sub-title">🧠 УЧЕЊЕ</h2>
    <div class="hub-grid">
      <button class="hub-btn green" data-go="game-classroom" aria-label="Учионица">🏫</button>
      <button class="hub-btn sky" data-go="game-tracing" aria-label="Писање">✏️</button>
      <button class="hub-btn sky" data-go="game-animals" aria-label="Животиње">🐾</button>
      <button class="hub-btn pink" data-go="game-shapes" aria-label="Облици">⭐</button>
      <button class="hub-btn" data-go="game-counting" aria-label="Бројање">🔢</button>
      <button class="hub-btn sky" data-go="game-coloring" aria-label="Бојење">🎨</button>
      <button class="hub-btn" data-go="game-piano" aria-label="Клавир">🎹</button>
      <button class="hub-btn green" data-go="game-compare" aria-label="Више или мање">⚖️</button>
      <button class="hub-btn pink" data-go="game-sorting" aria-label="Разврставање">🧺</button>
      <button class="hub-btn sky" data-go="game-phonics" aria-label="Слова и звуци">🔤</button>
      <button class="hub-btn pink" data-go="game-sequencing" aria-label="Редослед">📆</button>
      <button class="hub-btn sky" data-go="game-rhythm" aria-label="Ритам">🥁</button>
      <button class="hub-btn green" data-go="game-spatial" aria-label="Простор">🧭</button>
      <button class="hub-btn sky" data-go="game-maze" aria-label="Путања">🧩</button>
    </div>
  </div>

</div>

<script src="data/serbian.js"></script>
<script src="shared/navigation.js"></script>
<script src="data/app-registry.js"></script>
<script src="shared/celebration.js"></script>
<script src="shared/audio.js"></script>
<script src="shared/speech.js"></script>
<script src="shared/utils.js"></script>

<script src="shared/main.js"></script>
</body>
</html>
