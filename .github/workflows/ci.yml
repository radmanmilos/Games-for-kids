name: CI

# R4 (roadmap task 164) — four independent layers, so one failure can never
# hide the rest of the results:
#   setup    : generates the smoke matrix FROM the battery (never hand-listed)
#   fast     : cheap read-only gates. Runs NO game smoke except the hub.
#   smoke    : one matrix leg per smoke, fail-fast OFF.
#   release  : offline E2E + deployment-artifact validation, after fast+smoke.
#   extended : browser/device matrix — manual dispatch or weekly only.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly so the expensive layer still runs when nobody is pushing.
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # setup — the ONLY place the smoke list is defined. tools/run_all.js owns the
  # battery; CI reads it from there, so a newly added smoke can never be
  # silently left out of CI (the failure mode that left 6 tools unrun here).
  # hub_smoke is excluded because the fast job already runs it.
  # ---------------------------------------------------------------------------
  setup:
    name: Setup
    runs-on: ubuntu-24.04
    outputs:
      smokes: ${{ steps.matrix.outputs.smokes }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build the smoke matrix from the battery
        id: matrix
        run: |
          node -e "const fs=require('fs'),cp=require('child_process');const b=JSON.parse(cp.execFileSync(process.execPath,['tools/run_all.js','--list','--json'],{encoding:'utf8'}));const m=b.filter(n=>n!=='hub_smoke.js');fs.appendFileSync(process.env.GITHUB_OUTPUT,'smokes='+JSON.stringify(m)+'\n');console.log('battery: '+b.length+' tools -> '+m.length+' smoke legs (hub runs in the fast job)')"

  # ---------------------------------------------------------------------------
  # Job A — fast. Read-only. No game battery here.
  # ---------------------------------------------------------------------------
  fast:
    name: Fast (syntax, registry, metadata, hub, offline inventory)
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Fast gate (syntax, registry/metadata, CI workflow, generated
            artifacts, offline inventory, hub smoke — all read-only)
        run: node tools/check_fast.js

  # ---------------------------------------------------------------------------
  # Job B — game-smoke matrix. fail-fast: false is the whole point of R4:
  # a single game failure must not stop the other results from appearing.
  # ---------------------------------------------------------------------------
  smoke:
    name: Smoke ${{ matrix.smoke }}
    # `needs` only exposes DIRECT dependencies, and the matrix below reads
    # `needs.setup.outputs.smokes` — so `setup` must be listed here, not just
    # as `fast`'s dependency. With `needs: fast` alone, needs.setup is empty,
    # fromJSON('') throws and the entire smoke layer silently never runs.
    needs: [setup, fast]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        smoke: ${{ fromJSON(needs.setup.outputs.smokes) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run ${{ matrix.smoke }}
        # Through run_all.js, NOT `node tools/<smoke>` directly. run_all.js retries
        # a smoke that exits non-zero with ZERO checks twice, which is the
        # documented Chrome-boot-crash signature; check_fast.js applies the same
        # rule. Running the raw script bypassed the only guard the repo has for a
        # cold browser, so on `ubuntu-latest` 19 of 26 legs went red with
        # "Chrome did not start ... no assertions ran" while the same smokes pass
        # locally. A failure with at least one FAIL is never retried, so this
        # cannot hide a real regression.
        run: node tools/run_all.js ${{ matrix.smoke }}
        timeout-minutes: 10

  # ---------------------------------------------------------------------------
  # Job C — release QA. Depends on fast + every smoke leg.
  # tools/check_release.js is deliberately NOT run here: it re-runs the whole
  # battery, which this pipeline already did in parallel, one leg per job. Run
  # it locally before a release instead. It IS read-only now (task 165) — the
  # old version rewrote docs/ via sync-docs.sh and rebuilt the offline pack,
  # which is why it could never be a gate.
  #
  # validate_offline.js is NOT repeated here either: it is part of the fast
  # gate, so this job would be doing the same work twice.
  # ---------------------------------------------------------------------------
  release:
    name: Release QA (offline E2E, a11y report)
    needs: [fast, smoke]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # BLOCKING as of R6. This used to be continue-on-error because phase 2
      # started a fresh profile with no service worker and then blocked
      # 127.0.0.1 as well, so it only verified static markup (R2 finding, task
      # 153) - a green that meant nothing. It now primes the cache and cuts the
      # origin in ONE session and plays all 16 games with trusted input, so a
      # failure here is a real offline regression and the release stops.
      #
      # Run through run_all.js, NOT raw. This was the last runner in the repo
      # bypassing it, and it is why this job failed on every single run: Chrome
      # boot crashes are ROUTINE on GitHub runners. In run #40, 13 of the 27
      # matrix legs hit one, printed "[boot crash, exit 1 - retrying (1/2)]" and
      # passed on the retry - all of them through run_all.js. This step had no
      # retry, so the same routine event turned Release QA red every time
      # ("Chrome did not start (debug port N) after 4 attempts ... no assertions
      # ran", with the browser process still alive and the port simply silent).
      # Passing the filename explicitly keeps it out of the battery (the CI
      # matrix is generated from --list, which is unchanged at 27 tools) while
      # giving it the retry. run_all.js also had to learn to see a boot crash
      # that follows some PASS lines - this tool prints three disk/registry
      # checks before it boots a browser, so the old "0 checks" rule missed it.
      - name: Offline E2E
        run: node tools/run_all.js offline_smoke.mjs --concurrency 1
        timeout-minutes: 10

      # R10: the pinned axe-core build is vendored under tools/vendor; serious or
      # critical violations and incomplete scans both fail this release job.
      - name: Accessibility report
        run: node tools/axe_check.js --report
        timeout-minutes: 15

      # R7. The guards prove the checks they guard can actually FAIL: each one
      # breaks game/data/app-registry.js on purpose and requires a non-zero exit
      # with a specific message. They are separate files (not *_smoke.js), so
      # run_all does not pick them up, and they are wired here rather than into
      # check_fast because they mutate a tracked source file and restore it -
      # a read-only gate must never do that.
      - name: Registry contract guards (negative test)
        run: node tools/guards/registry_guards_negtest.js

      - name: Route-contract assertions (negative test)
        run: node tools/guards/route_contract_negtest.js

      # The derived game-file -> smoke mapping in run_all.js replaced a hand-written
      # table that had already drifted from the registry. This guard proves the
      # mapping is complete and that it can fail: it also edits a page and restores it.
      - name: Game-file smoke mapping guard (negative test)
        run: node tools/guards/games_map_negtest.js

  # ---------------------------------------------------------------------------
  # Job D — extended / manual. Expensive, so it never runs on every push.
  # ---------------------------------------------------------------------------
  extended:
    name: Extended (Chromium + WebKit device matrix)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Playwright browsers
        run: npx --yes playwright install --with-deps chromium webkit

      - name: Chromium + WebKit across 5 viewports
        run: node tools/play_matrix.mjs
        timeout-minutes: 25
