name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Fast checks: syntax + registry validation + hub smoke
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: node tools/check_all.js

      - name: Registry/route validation
        run: node tools/validate_pages.js

      - name: Hub smoke
        run: node tools/hub_smoke.js

  # Full smoke battery (parallel)
  smoke:
    runs-on: ubuntu-latest
    needs: fast
    strategy:
      matrix:
        smoke:
          - animals_smoke
          - shapes_smoke
          - candy_smoke
          - memory_smoke
          - puzzle_smoke
          - counting_smoke
          - coloring_smoke
          - classroom_smoke
          - tracing_smoke
          - piano_smoke
          - driving_smoke
          - ocean_smoke
          - dino_smoke
          - space_smoke
          - racing3d_smoke
          - kitty_smoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run ${{ matrix.smoke }}
        run: node tools/${{ matrix.smoke }}.js
        timeout-minutes: 5

  # Expensive checks (separate job, runs after fast passes)
  release:
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Offline E2E
        run: node tools/offline_smoke.mjs
        timeout-minutes: 10

      - name: Touch interruption
        run: node tools/touch_interruption_smoke.js
        timeout-minutes: 10
