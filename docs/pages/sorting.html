<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#4A3F6B">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Разврставање — Петрин свет</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧺</text></svg>">
<link rel="stylesheet" href="../styles/viewport.css">
<link rel="stylesheet" href="../styles/design-tokens.css">
<link rel="stylesheet" href="../shared/accessibility.css">
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;background:var(--cream);font-family:Fredoka, sans-serif;color:var(--plum);}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4vmin;padding:4vmin;}
  .back-btn{position:absolute;top:2.6vmin;left:2.6vmin;width:11vmin;height:11vmin;border-radius:50%;border:none;background:var(--plum);color:#fff;font-size:5vmin;display:flex;align-items:center;justify-content:center;box-shadow:0 1vmin 0 rgba(0,0,0,.2);z-index:20;}
  .back-btn:active{transform:scale(.92) translateY(3px);}
  #sort-prompt{font-size:5.4vmin;font-weight:800;line-height:1.15;text-align:center;}
  .sort-baskets{display:flex;gap:4vmin;justify-content:center;width:100%;}
  .sort-basket{position:relative;flex:1 1 0;max-width:42vmin;min-height:29vmin;padding:2vmin;border:3px dashed rgba(74,63,107,.25);border-radius:24px;background:#fff;box-shadow:0 1.4vmin 0 rgba(0,0,0,.06);display:flex;flex-direction:column;align-items:center;gap:1.4vmin;cursor:pointer;transition:transform .12s ease, border-color .12s ease;}
  .sort-basket:active{transform:translateY(3px);}
  .sort-bin-head{display:flex;align-items:center;gap:1.6vmin;font-size:4.2vmin;font-weight:800;}
  .sort-bin-label{white-space:nowrap;}
  .sort-bin-slot{display:flex;flex-wrap:wrap;gap:1vmin;justify-content:center;align-content:flex-start;min-height:11vmin;width:100%;}
  .sort-visual{display:inline-block;}
  .sort-emoji{font-size:8vmin;line-height:1;}
  .sort-swatch{width:8vmin;height:8vmin;border-radius:50%;box-shadow:inset 0 0 0 .6vmin rgba(255,255,255,.55);}
  .sort-chip .sort-emoji{font-size:5.5vmin;}
  .sort-chip .sort-swatch{width:5.5vmin;height:5.5vmin;}
  .sort-tray{display:flex;flex-wrap:wrap;gap:2.4vmin;justify-content:center;align-items:center;min-height:16vmin;width:100%;padding:1.2vmin;border-radius:20px;background:rgba(74,63,107,.05);}
  .sort-item{width:15vmin;height:15vmin;border:none;border-radius:50%;background:#fff;box-shadow:0 1vmin 0 rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;cursor:grab;transition:transform .18s ease, box-shadow .12s ease;touch-action:none;user-select:none;-webkit-user-select:none}
  .sort-item:active{cursor:grabbing;}
  .sort-item.sort-selected{box-shadow:0 0 0 .8vmin rgba(103,201,113,.6), 0 1vmin 0 rgba(0,0,0,.12);transform:translateY(-1vmin);}
  .sort-item.sort-dragging{transition:none;z-index:50;box-shadow:0 2vmin 2vmin rgba(0,0,0,.25);}
  .sort-over{border-color:var(--green)!important;background:#f1fff1;}
  .sort-good{animation:sort-pop .4s ease;border-color:var(--green)!important;}
  .sort-wrong{animation:sort-shake .4s ease;border-color:var(--pink)!important;}
  .sort-hint{animation:sort-pulse .8s ease-in-out 2;border-color:var(--green)!important;}
  #sort-feedback{min-height:6vmin;font-size:4vmin;font-weight:700;color:var(--green);text-align:center;}
  @keyframes sort-pop{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
  @keyframes sort-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.4vmin)}75%{transform:translateX(1.4vmin)}}
  @keyframes sort-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  @media (prefers-reduced-motion: reduce){.sort-good,.sort-wrong,.sort-hint{animation:none}}
  /* Desktop sizes need desktop HEIGHT too: an 844x390 short-landscape window
     is 800px+ wide but only 390 tall, and the 112px items + 230px baskets
     overflowed the fold (V3.1 audit FAIL: sort-item bottom 413 > 390). */
  @media (min-width:800px) and (min-height:600px){
    #sort-prompt{font-size:42px}
    .sort-basket{max-width:340px;min-height:230px}
    .sort-bin-head{font-size:32px}
    .sort-emoji{font-size:60px}
    .sort-swatch{width:60px;height:60px}
    .sort-chip .sort-emoji{font-size:40px}
    .sort-chip .sort-swatch{width:40px;height:40px}
    .sort-item{width:112px;height:112px}
    #sort-feedback{font-size:30px}
  }
</style>
</head>
<body>
<div id="app">
  <button class="back-btn" id="sorting-back" aria-label="Назад"><svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
  <div id="sort-prompt">Разврстај!</div>
  <div class="sort-baskets" id="sort-baskets"></div>
  <div class="sort-tray" id="sort-tray"></div>
  <div id="sort-feedback" aria-live="polite"></div>
</div>
<script src="../data/serbian.js"></script>
<script src="../shared/navigation.js"></script>
<script src="../shared/celebration.js"></script>
<script src="../shared/audio.js"></script>
<script src="../shared/speech.js"></script>
<script src="../shared/utils.js"></script>
<script src="../games/sorting.js"></script>
<script src="../shared/audio-buses.js"></script>
<script src="../shared/viewport.js"></script>
<script src="../shared/input.js"></script>
<script src="../shared/feedback.js"></script>
<script src="../shared/motion.js"></script>
<script src="../data/app-registry.js"></script>
<script src="../shared/main.js"></script>
</body>
</html>
