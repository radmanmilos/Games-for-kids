<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4A3F6B">
  <link rel="manifest" href="../manifest.json">
  <title>За родитеље — Петрин свет</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
  <link rel="stylesheet" href="../styles/viewport.css">
  <link rel="stylesheet" href="../styles/design-tokens.css">
  <link rel="stylesheet" href="../shared/accessibility.css">
  <link rel="stylesheet" href="../styles/components.css">
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
    html,body{margin:0;padding:0;width:100%;height:100%;background:var(--cream);font-family:'Fredoka',sans-serif;}
    /* The parent card is often taller than a short phone or a landscape tablet,
       and this page used to be `overflow:hidden` with a centred flex child — so
       on a small screen the bottom of the card (the buttons, the status line)
       was simply unreachable with no scrollbar to reveal it. #app now scrolls,
       and the card is a COLUMN flex item with `margin:auto`: it centres when it
       fits, and because the auto margins are on the MAIN axis they resolve to
       zero when the card overflows (unlike row/cross-axis centring, which clips
       the top and leaves it unreachable even in a scroll container). */
    #app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4vmin;}
    .parent-card{margin:auto;}
    /* V19 (spec §37/§43): the parent surface is calm and grouped, never a
       developer dashboard. One soft-shadow card (no toy offset shadow) holds
       labelled sections; each section is a restrained cream panel with a clear
       boundary and no shadow. Labels and values are readable (≥13px), progress
       is summarised, and the raw detail lives behind disclosures. Colours come
       from the shared tokens (plum / cream / green / red) — nothing invented. */
    .parent-card{background:#fff;border-radius:var(--radius-lg);padding:5vmin;max-width:640px;width:100%;box-shadow:var(--shadow-card);}
    .parent-card h1{color:var(--plum);font-size:clamp(20px,4vmin,34px);margin:0 0 4vmin;text-align:center;}
    .parent-section{background:var(--cream);border:1px solid rgba(74,63,107,.10);border-radius:var(--radius-md);padding:3.4vmin 4vmin;margin:0 0 3vmin;}
    .section-title{color:var(--plum);font-weight:700;font-size:clamp(14px,2.4vmin,18px);letter-spacing:.01em;margin:0 0 2.2vmin;}
    /* R12: the parent surface is where every technical fact lives — connection,
       version, offline copy — as readable label → value rows, never tiny pills. */
    .status-list{margin:0;display:flex;flex-direction:column;gap:1.6vmin;}
    .status-row{display:flex;justify-content:space-between;align-items:center;gap:3vmin;}
    .status-key{margin:0;color:var(--plum-soft);font-weight:600;font-size:clamp(13px,2.1vmin,16px);}
    .status-value{margin:0;color:var(--plum);font-weight:700;font-size:clamp(13px,2.1vmin,16px);display:inline-flex;align-items:center;gap:1.2vmin;text-align:right;}
    .meta-dot{flex:0 0 auto;width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(103,201,113,.25);}
    .meta-dot.offline{background:#E2574C;box-shadow:0 0 0 3px rgba(226,87,76,.25);}
    /* R19: a plain record of what was used/practiced, in the parent area only —
       a count summary up front, the names behind a disclosure. No score, no
       streak, no comparison, no dense table. */
    .progress-list{margin:0;display:flex;flex-direction:column;gap:1.8vmin;}
    .progress-row{display:flex;justify-content:space-between;align-items:baseline;gap:3vmin;}
    .progress-key{margin:0;color:var(--plum-soft);font-weight:600;font-size:clamp(13px,2.1vmin,16px);}
    .progress-value{margin:0;color:var(--plum);font-weight:800;font-size:clamp(15px,2.5vmin,19px);}
    .progress-details{margin-top:2.4vmin;}
    .progress-details>summary{cursor:pointer;color:var(--plum-soft);font-weight:600;font-size:clamp(13px,2.1vmin,16px);padding:1vmin 0;}
    .progress-games{margin-top:1.4vmin;color:var(--plum);font-weight:600;font-size:clamp(13px,2.1vmin,16px);line-height:1.7;word-break:break-word;user-select:text;-webkit-user-select:text;}
    .parent-btn{display:flex;align-items:center;gap:3vmin;width:100%;padding:3vmin 4vmin;margin:0 0 2vmin;border:2px solid rgba(74,63,107,.35);border-radius:var(--radius-md);background:#fff;color:var(--plum);font:600 clamp(14px,2.5vmin,20px) 'Fredoka',sans-serif;cursor:pointer;text-align:left;}
    .parent-btn:last-of-type{margin-bottom:0;}
    .parent-btn:active{transform:scale(.98);}
    .parent-btn.primary{background:var(--plum);color:#fff;border-color:var(--plum);}
    .parent-btn:disabled{opacity:.5;cursor:default;}
    .parent-status{margin-top:2.6vmin;padding:2vmin 3vmin;border-radius:var(--radius-sm);background:#fff;color:var(--plum);font:600 clamp(13px,2.1vmin,16px) 'Fredoka',sans-serif;text-align:center;}
    /* R17: technical facts stay available but out of the way, and readable. */
    .diagnostics{margin-top:2.6vmin;color:var(--plum);font:600 clamp(13px,2vmin,15px) 'Fredoka',sans-serif;}
    .diagnostics>summary{cursor:pointer;padding:1vmin 0;color:var(--plum-soft);}
    .diag-body{margin-top:1.5vmin;padding:2vmin 3vmin;border-radius:var(--radius-sm);background:#fff;line-height:1.7;word-break:break-word;user-select:text;-webkit-user-select:text;}
    /* R17: a parent must see that the offline download is moving, not just guess. */
    .cache-bar{margin-top:2vmin;width:100%;height:2.6vmin;min-height:10px;border-radius:999px;background:#fff;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(74,63,107,.15);}
    .cache-bar[hidden]{display:none;}
    .cache-bar-fill{height:100%;width:0;border-radius:999px;background:var(--plum);transition:width .2s ease;}
    @media (prefers-reduced-motion: reduce){.cache-bar-fill{transition:none;}}
    /* V7.1: back-control chrome comes from the shared .ps-back component
       (styles/components.css); this rule keeps only the page layout. */
    .back-btn{position:fixed;top:4vmin;left:4vmin;z-index:5;}

    /* --- Parent gate (task 201) -------------------------------------------
       A toddler can reach «За родитеље» and tap «Обриши локални напредак»
       or «Преузми за офлајн рад». The gate is deliberately a MULTIPLICATION
       question: the user asked for it on the grounds that a child who already
       knows addition and subtraction could otherwise walk straight through a
       sum, while multiplication tables are not something that age has. It is a
       speed bump for a small child, never a lock — there is no timeout, no
       penalty, no attempt limit, and a wrong answer just re-asks. */
    .gate{text-align:center;background:var(--cream);border:1px solid rgba(74,63,107,.10);border-radius:var(--radius-md);padding:3.4vmin 4vmin;margin:0 0 3vmin;}
    .gate-q{font:800 clamp(22px,5vmin,40px) 'Fredoka',sans-serif;color:var(--plum);margin:1vmin 0 3vmin;}
    .gate-choices{display:grid;grid-template-columns:repeat(2,1fr);gap:2.5vmin;}
    .gate-choice{padding:3.2vmin 2vmin;border:3px solid var(--plum);border-radius:var(--radius-md);background:#fff;color:var(--plum);font:800 clamp(18px,3.4vmin,28px) 'Fredoka',sans-serif;cursor:pointer;min-height:13vmin;}
    .gate-choice:active{transform:scale(.98);}
    .gate-choice.right{background:var(--green,#67C971);color:white;border-color:var(--green,#67C971);}
    .gate-choice.wrong{animation:gate-shake .35s ease;border-color:#E2574C;}
    @keyframes gate-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.2vmin)}75%{transform:translateX(1.2vmin)}}
    .gate-note{margin-top:2.5vmin;font:600 clamp(13px,2.2vmin,16px) 'Fredoka',sans-serif;color:#E2574C;min-height:1.4em;}
    /* The gate and the actions are mutually exclusive: the actions are removed
       from the DOM flow, not merely disabled, so there is nothing for a stray
       tap or a screen reader to reach before the question is answered. */
    #parentActions[hidden],#parentGate[hidden]{display:none;}
    /* Short viewports: tighten the grouped sections so more of the card fits
       without the parent having to scroll for the common case. */
    @media (max-height:620px){
      .parent-card{padding:3.5vmin;}
      .parent-section{padding:2.6vmin 3vmin;margin:0 0 2.2vmin;}
      .section-title{margin:0 0 1.6vmin;}
      .parent-btn{margin:0 0 1.4vmin;padding:2.2vmin 3vmin;}
      .gate{padding:2.6vmin 3vmin;margin:0 0 2.2vmin;}
      .gate-q{margin:0.6vmin 0 2vmin;}
      .gate-choices{gap:1.8vmin;}
      .gate-choice{min-height:11vmin;padding:2.4vmin 1.6vmin;}
    }
  </style>
</head>
<body>
  <div id="app">
    <button id="back-btn" class="back-btn ps-back" aria-label="Назад"><svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
    <div class="parent-card">
      <h1>🔒 За родитеље</h1>

      <section class="parent-section" aria-labelledby="statusTitle">
        <h2 class="section-title" id="statusTitle">Статус</h2>
        <dl class="status-list">
          <div class="status-row">
            <dt class="status-key">Веза</dt>
            <dd class="status-value"><span class="meta-dot" id="conn-dot"></span><span id="conn-status">Онлајн</span></dd>
          </div>
          <div class="status-row">
            <dt class="status-key">Верзија</dt>
            <dd class="status-value" id="version-info">…</dd>
          </div>
          <div class="status-row">
            <dt class="status-key">Офлајн копија</dt>
            <dd class="status-value" id="offline-copy-info">…</dd>
          </div>
        </dl>
      </section>

      <section class="parent-section" id="parent-progress" aria-labelledby="progressTitle">
        <h2 class="section-title" id="progressTitle">📊 Напредак</h2>
        <dl class="progress-list">
          <div class="progress-row">
            <dt class="progress-key">Коришћено</dt>
            <dd class="progress-value" id="progress-used">још ништа</dd>
          </div>
          <div class="progress-row">
            <dt class="progress-key">Вежбано</dt>
            <dd class="progress-value" id="progress-practiced">још ништа</dd>
          </div>
        </dl>
        <details class="progress-details">
          <summary>Које игре</summary>
          <div class="progress-games" id="progress-games">још ништа</div>
        </details>
      </section>

      <div class="gate" id="parentGate">
        <div class="gate-q" id="gateQuestion">…</div>
        <div class="gate-choices" id="gateChoices"></div>
        <div class="gate-note" id="gateNote" aria-live="polite"></div>
      </div>

      <section class="parent-section" id="parentActions" hidden aria-labelledby="actionsTitle">
        <h2 class="section-title" id="actionsTitle">Радње</h2>
        <button class="parent-btn primary" id="download-offline">📥 Преузми за офлајн рад</button>
      <button class="parent-btn" id="check-updates">🔄 Провери ажурирања</button>
      <button class="parent-btn" id="reset-progress">🗑 Обриши локални напредак</button>
      <button class="parent-btn" id="audio-test">🔊 Тест звука</button>
      <!-- No manual ZIP download. The offline experience is the service worker:
           "Преузми за офлајн рад" below caches every file the app needs, so there
           is nothing for a parent to unpack by hand. Removed 2026-10-02 per user
           decision (superseding the 2026-09-30 "keep it hidden" decision). -->
      <div class="parent-status" id="parent-status">Спремно</div>
      <div class="cache-bar" id="cache-bar" role="progressbar" aria-label="Преузимање за офлајн рад" aria-valuemin="0" aria-valuemax="100" hidden><div class="cache-bar-fill" id="cache-bar-fill"></div></div>
      <details class="diagnostics">
        <summary>Технички детаљи</summary>
        <div class="diag-body" id="diag-body">…</div>
      </details>
      </section><!-- /#parentActions -->
    </div>
  </div>
  <script src="../data/serbian.js"></script>
  <script src="../shared/navigation.js"></script>
  <script src="../shared/audio.js"></script>
  <script src="../shared/audio-buses.js"></script>
  <script src="../shared/speech.js"></script>
  <script src="../shared/utils.js"></script>
  <script src="../data/app-registry.js"></script>
  <script src="../shared/main.js"></script>
  <script>
    (function() {
      /* --- Parent gate -----------------------------------------------------
         A one-question speed bump in front of the parenting actions, at the
         user's request. Deliberately MULTIPLICATION: the reasoning given was that
         a child who already knows addition and subtraction could walk straight
         through a sum, and multiplication tables are not something that age has.
         The correct answer's position is randomised on every page load so it
         cannot be learned, and it is NOT a lock: no timer, no attempt limit, no
         penalty — a wrong answer shakes and re-asks.

         Deliberately silent: no speech is triggered, because new Serbian words
         cannot be recorded in this repo (see PROJECT_TASKS task 198), and the
         gate must not depend on an asset that does not exist. */
      const GATE = [
        { a: 6, b: 7 }, { a: 7, b: 8 }, { a: 8, b: 9 },
        { a: 9, b: 7 }, { a: 7, b: 9 }, { a: 9, b: 6 },
      ];
      const gateEl = document.getElementById('parentGate');
      const gateQ = document.getElementById('gateQuestion');
      const gateChoices = document.getElementById('gateChoices');
      const gateNote = document.getElementById('gateNote');
      const actionsEl = document.getElementById('parentActions');

      function newGateQuestion() {
        const pick = GATE[Math.floor(Math.random() * GATE.length)];
        const answer = pick.a * pick.b;
        gateQ.textContent = pick.a + ' × ' + pick.b + ' = ?';
        gateNote.textContent = '';
        gateChoices.textContent = '';
        // Plausible near-misses (adjacent tables / digit transposes) rather than
        // obviously-wrong numbers, so the question is not guessable by shape.
        const wrong = [answer + pick.a, answer - pick.b, answer + 10];
        const opts = wrong.concat([answer]);
        for (let i = opts.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const t = opts[i]; opts[i] = opts[j]; opts[j] = t;
        }
        opts.forEach(function (value) {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'gate-choice';
          b.textContent = String(value);
          b.dataset.value = String(value);
          b.addEventListener('click', function () {
            if (value === answer) {
              b.classList.add('right');
              gateNote.textContent = '';
              // Reveal the actions only after a correct answer. `hidden` (not a
              // disabled button) so nothing is focusable or tappable before then.
              gateEl.hidden = true;
              actionsEl.hidden = false;
            } else {
              b.classList.remove('wrong');
              void b.offsetWidth;
              b.classList.add('wrong');
              gateNote.textContent = 'Покушај поново';
            }
          });
          gateChoices.appendChild(b);
        });
      }

      if (gateEl && gateQ && gateChoices && actionsEl) newGateQuestion();
      // Test hook: the smoke needs to answer correctly without guessing.
      window.__parentGate = {
        answer: function () {
          const q = gateQ.textContent.split(' ');
          return parseInt(q[0], 10) * parseInt(q[2], 10);
        },
        solved: function () { return !actionsEl.hidden; },
        open: newGateQuestion,
      };

      const status = document.getElementById('parent-status');
      const downloadBtn = document.getElementById('download-offline');
      const checkBtn = document.getElementById('check-updates');
      const resetBtn = document.getElementById('reset-progress');
      const audioBtn = document.getElementById('audio-test');
      const connStatus = document.getElementById('conn-status');
      const connDot = document.getElementById('conn-dot');
      const versionInfo = document.getElementById('version-info');
      const cacheBar = document.getElementById('cache-bar');
      const cacheBarFill = document.getElementById('cache-bar-fill');

      // R17: show real download progress so a parent can tell "working" from
      // "stuck". Bar and text share one helper so they can never disagree.
      const showProgress = (completed, total) => {
        const pct = Math.round((completed / Math.max(1, total)) * 100);
        cacheBar.hidden = false;
        cacheBarFill.style.width = pct + '%';
        cacheBar.setAttribute('aria-valuenow', String(pct));
        status.textContent = 'Преузимам ' + completed + '/' + total + ' (' + pct + '%)';
      };
      const hideProgress = () => {
        cacheBar.hidden = true;
        cacheBarFill.style.width = '0%';
        cacheBar.removeAttribute('aria-valuenow');
      };
      const beginProgress = (label) => {
        cacheBar.hidden = false;
        cacheBarFill.style.width = '0%';
        cacheBar.setAttribute('aria-valuenow', '0');
        status.textContent = label;
      };

      // R12: connection status — live, so a parent who loses wifi mid-session
      // sees it immediately rather than after a failed action.
      const renderConn = () => {
        const on = navigator.onLine !== false;
        connStatus.textContent = on ? 'Онлајн' : 'Офлајн';
        connDot.className = 'meta-dot' + (on ? '' : ' offline');
      };
      renderConn();
      window.addEventListener('online', renderConn);
      window.addEventListener('offline', renderConn);

      // R17: version, from the single source of truth (manifest.json). It is in
      // the cache list, so this still resolves when the page is used offline.
      let appVersion = null;

      // R17: is a complete offline copy in Cache Storage? The service worker
      // pre-caches the whole inventory on install, so the offline manifest being
      // present in a cache is the honest signal that offline play is possible.
      const offlineCopyInfo = document.getElementById('offline-copy-info');
      const cacheHasOfflineManifest = async () => {
        try {
          for (const name of await caches.keys()) {
            const cache = await caches.open(name);
            const keys = await cache.keys();
            if (keys.some(k => new URL(k.url).pathname.endsWith('/offline-manifest.json'))) return true;
          }
        } catch (e) { /* Cache Storage unavailable — treat as not ready */ }
        return false;
      };
      const renderOfflineCopy = async () => {
        const ready = await cacheHasOfflineManifest();
        offlineCopyInfo.textContent = ready ? 'спремна' : 'није преузета';
      };

      // R19: what was used and practiced, read from the shared local store
      // (window.PetrinProgress, defined by shared/main.js). V19 (spec §37): the
      // panel leads with a readable COUNT summary ("N од M") and the game names
      // live behind a disclosure, so the record never becomes a dense wall.
      // Names come from the app registry, so the parent sees titles, not ids.
      // Purely a record — no score, no streak, no comparison.
      const progressUsed = document.getElementById('progress-used');
      const progressPracticed = document.getElementById('progress-practiced');
      const progressGames = document.getElementById('progress-games');
      const titleFor = (id) => {
        const app = (window.APP_REGISTRY || []).find(a => a.id === id);
        return app ? app.title : id;
      };
      const totalGames = () => (window.APP_REGISTRY || []).filter(a => a.category !== 'parent').length;
      const renderProgress = () => {
        const p = window.PetrinProgress ? window.PetrinProgress.snapshot() : null;
        const used = p ? Object.keys(p.played) : [];
        const practiced = p ? Object.keys(p.completed).filter(id => p.completed[id] > 0) : [];
        const total = totalGames();
        progressUsed.textContent = used.length ? used.length + ' од ' + total : 'још ништа';
        progressPracticed.textContent = practiced.length ? practiced.length + ' од ' + total : 'још ништа';
        const lines = [];
        if (used.length) lines.push('Коришћено: ' + used.map(titleFor).join(', ') + '.');
        if (practiced.length) lines.push('Вежбано: ' + practiced.map(id => titleFor(id) + ' (×' + p.completed[id] + ')').join(', ') + '.');
        progressGames.textContent = lines.length ? lines.join(' ') : 'још ништа';
      };
      renderProgress();
      // Test hook (mirrors window.__parentGate): the smoke needs to render the
      // summary for recorded data without a full page reload.
      window.__parentProgress = renderProgress;

      // R17: technical facts live behind a disclosure, never in the parent's face.
      const diagBody = document.getElementById('diag-body');
      const renderDiag = async () => {
        let cacheNames = [];
        try { cacheNames = await caches.keys(); } catch (e) { /* ignore */ }
        let scope = '';
        try {
          const reg = await navigator.serviceWorker.getRegistration();
          if (reg) scope = reg.scope;
        } catch (e) { /* ignore */ }
        diagBody.textContent = [
          'Верзија: ' + (appVersion || 'непозната'),
          'Кеш: ' + (cacheNames.join(', ') || 'нема'),
          'Опсег: ' + (scope || 'нема'),
          'Веза: ' + (navigator.onLine !== false ? 'онлајн' : 'офлајн'),
        ].join(' · ');
      };

      fetch('../manifest.json')
        .then(r => r.json())
        .then(m => {
          appVersion = m.version || null;
          versionInfo.textContent = appVersion || 'нема';
        })
        .catch(() => { versionInfo.textContent = 'непозната'; })
        .then(renderDiag);
      renderOfflineCopy();

      // R17: set when the update check found a newer asset set and the parent has
      // not yet re-cached. Drives the "Ажурирано" confirmation after the update.
      let pendingUpdate = false;

      // Download / update offline copy
      downloadBtn.addEventListener('click', async () => {
        downloadBtn.disabled = true;
        downloadBtn.setAttribute('aria-busy', 'true');
        beginProgress(pendingUpdate ? 'Ажурирам...' : 'Спремам...');
        try {
          if ('serviceWorker' in navigator) {
            const reg = await navigator.serviceWorker.ready;
            if (reg.active) {
              reg.active.postMessage({ cmd: 'cacheAll' });
            } else {
              hideProgress();
              status.textContent = 'Сервис још није спреман';
              downloadBtn.disabled = false;
            }
          } else {
            hideProgress();
            status.textContent = 'Офлајн није подржан';
            downloadBtn.disabled = false;
          }
        } catch (e) {
          hideProgress();
          status.textContent = 'Грешка: ' + e.message;
          downloadBtn.disabled = false;
        }
      });

      // Check updates
      checkBtn.addEventListener('click', async () => {
        checkBtn.disabled = true;
        status.textContent = 'Проверавам...';
        try {
          if ('serviceWorker' in navigator) {
            const reg = await navigator.serviceWorker.ready;
            if (reg.active) {
              reg.active.postMessage({ cmd: 'checkForUpdates' });
            } else {
              status.textContent = 'Сервис још није спреман';
            }
          } else {
            status.textContent = 'Није подржано';
          }
        } catch (e) {
          status.textContent = 'Грешка: ' + e.message;
        }
        checkBtn.disabled = false;
      });

      // Reset progress
      resetBtn.addEventListener('click', () => {
        if (confirm('Обриши сав локални напредак?')) {
          if (window.PetrinProgress) window.PetrinProgress.reset();
          localStorage.clear();
          renderProgress();
          status.textContent = 'Напредак обрисан';
        }
      });

      // Audio test
      audioBtn.addEventListener('click', () => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.value = 440;
          gain.gain.value = 0.3;
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
          status.textContent = 'Тест звука: 🔊';
        } catch (e) {
          status.textContent = 'Звук није доступан';
        }
      });

      // Listen for SW messages
      if ('serviceWorker' in navigator && navigator.serviceWorker.addEventListener) {
        navigator.serviceWorker.addEventListener('message', (e) => {
          const data = e.data || {};
          if (data.type === 'cache-progress') {
            showProgress(data.completed || 0, data.total || 0);
          }
          if (data.type === 'cache-complete') {
            hideProgress();
            if (pendingUpdate) {
              status.textContent = 'Ажурирано';
              downloadBtn.textContent = '📥 Преузми за офлајн рад';
              pendingUpdate = false;
            } else {
              status.textContent = 'Сачувано за офлајн рад';
            }
            downloadBtn.disabled = false;
            downloadBtn.removeAttribute('aria-busy');
            renderOfflineCopy();
            renderDiag();
          }
          if (data.type === 'check-result') {
            if (data.changed && data.changed > 0) {
              status.textContent = 'Постоји нова верзија';
              pendingUpdate = true;
              downloadBtn.textContent = '⬆️ Ажурирај офлајн копију';
            } else {
              status.textContent = 'Нема ажурирања';
            }
          }
          // A new worker took over (version bump). Confirm it and refresh facts.
          if (data.type === 'updated') {
            status.textContent = 'Ажурирано';
            renderOfflineCopy();
            renderDiag();
          }
          // Offline the manifest fetch in the worker fails, so the only answer the
          // parent ever got was «Проверавам...» with the button stuck disabled.
          if (data.type === 'check-error') {
            status.textContent = 'Нема интернета — ажурирања се не могу проверити';
            checkBtn.disabled = false;
          }
          if (data.type === 'cache-error') {
            hideProgress();
            status.textContent = 'Грешка при преузимању: ' + (data.message || 'непознато');
            downloadBtn.disabled = false;
            downloadBtn.removeAttribute('aria-busy');
          }
        });
      }
    })();
  </script>
</body>
</html>
