<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#4A3F6B">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мачја шума — Петрин свет</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
<link rel="stylesheet" href="../styles/viewport.css">
<link rel="stylesheet" href="../styles/design-tokens.css">
<link rel="stylesheet" href="../styles/learning-stage.css">
<link rel="stylesheet" href="../shared/accessibility.css">
<link rel="stylesheet" href="../styles/components.css">
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;background:var(--cream);font-family:Fredoka, sans-serif;color:var(--plum);}
  #app.cf-app{position:fixed;inset:0;}
  #app.cf-app .back-btn{position:absolute;top:2.6vmin;left:2.6vmin;z-index:20;}

  /* Stage: absolute, not fixed — #app is already position:fixed;inset:0, so this
     covers the viewport identically and the short-landscape audit does not read
     two sibling fixed elements as a chrome pair (task 262 / CF-01 deviation). */
  #cf-stage{position:absolute;inset:0;overflow:hidden;}
  #cf-stage > *{position:absolute;}

  /* ---- decorative layers: aria-hidden in markup AND unclickable, so no tree
         or hill can ever steal a child's tap (TP §3.2) ---- */
  .cf-sky{inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(#DDF1FF 0%, #EAF7E4 58%, #F7ECCF 100%);}
  #cf-scenery{inset:0;z-index:2;pointer-events:none;}
  #cf-decor{inset:0;z-index:3;pointer-events:none;}

  /* CF-11 night: gradients cannot transition, so day->night is three stacked
     opacity layers (the night sky, a tint over the scenery, the stars) that
     cross-fade in 600 ms — transform/opacity only (TD §10) — and flip
     instantly under reduced motion. All decorative, aria-hidden and
     unclickable like every other scenery layer. */
  #cf-sky-night{inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .6s ease;
    background:linear-gradient(#241B47 0%, #3A2F63 58%, #4A3F6B 100%);}
  #cf-night-tint{inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .6s ease;
    background:rgba(26,18,58,.34);}
  #cf-stars{inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .6s ease;}
  .cf-star{position:absolute;line-height:1;font-size:5vmin;font-variant-emoji:emoji;}
  .cf-star::before{content:"✨";}
  .cf-star-1{left:14%;top:8%;}
  .cf-star-2{left:46%;top:5%;font-size:4vmin;}
  .cf-star-3{left:70%;top:11%;}
  #app[data-time="night"] #cf-sky-night,
  #app[data-time="night"] #cf-night-tint,
  #app[data-time="night"] #cf-stars{opacity:1;}

  /* CF-12 rain: decorative layer over the whole scene but under the tray and
     the toggles (z8, DOM before #cf-tray which shares z8, so the UI stays on
     top). transform/opacity only, one phase + duration per drop (deterministic
     --x/--d/--dur/--y set by renderRain — no RNG, TD §6) so the sheet never
     pulses as one. Reduced motion parks the SAME drops at --y, dimmed and     motionless (step 2: static, low-opacity drops, no animation). */
  #cf-rain{position:absolute;inset:0;z-index:8;pointer-events:none;}
  /* Custom-prop defaults live on the rule itself (not as var() fallbacks) so the
     animation shorthand stays comma-free — hub smoke's V21 motion gate
     tokenizes shorthand values on commas. renderRain's inline values win. */
  #cf-rain i{--x:50%;--d:0s;--dur:1.1s;--y:20vh;position:absolute;top:-8%;left:var(--x);
    width:.55vmin;height:2.4vmin;border-radius:2px;background:rgba(140,170,210,.7);opacity:.5;
    animation:cf-drop var(--dur) linear infinite;animation-delay:var(--d);}
  @keyframes cf-drop{
    from{transform:translateY(0);opacity:.2;}
    35%{opacity:.6;}
    to{transform:translateY(116vh);opacity:.25;}}

  /* Scenery: hills are CSS shapes; trees are emoji drawn through ::before so no
     text node exists (the no-visible-text guard reads body.innerText). */
  .cf-hill{position:absolute;border-radius:50% 50% 0 0;background:#BFE3B0;opacity:.9;}
  .cf-hill-1{left:-14vmin;right:30vmin;bottom:-20vmin;height:36vmin;}
  .cf-hill-2{left:32vmin;right:-16vmin;bottom:-24vmin;height:42vmin;background:#A9D69A;opacity:.85;}
  .cf-tree{position:absolute;line-height:1;font-size:12vmin;font-variant-emoji:emoji;}
  .cf-tree::before{content:"🌲";}
  .cf-tree-1{left:2vmin;bottom:27vmin;}
  .cf-tree-2{right:3vmin;bottom:29vmin;font-size:10vmin;}
  .cf-tree-3{left:20vmin;bottom:24vmin;font-size:8vmin;}

  /* ---- interactive layers: the container never blocks, only its controls do ---- */
  #cf-plates{z-index:4;left:0;right:0;top:48%;transform:translateY(-50%);
    display:flex;justify-content:center;align-items:center;gap:clamp(16px,6vmin,64px);
    pointer-events:none;}
  .cf-plate{pointer-events:auto;position:relative;padding:0;border:none;background:none;cursor:pointer;
    width:clamp(72px,22vmin,132px);aspect-ratio:1;border-radius:50%;
    display:grid;place-items:center;line-height:1;
    filter:drop-shadow(0 1vmin 1.2vmin rgba(74,63,107,.16));
    transition:transform .16s ease, filter .16s ease;}
  .cf-plate::before{content:"🍽️";font-size:clamp(40px,14vmin,88px);line-height:1;font-variant-emoji:emoji;}
  .cf-plate-treat{position:absolute;left:50%;top:50%;transform:translate(-50%,-64%);
    font-size:clamp(30px,9vmin,56px);line-height:1;opacity:0;font-variant-emoji:emoji;}
  .cf-plate-treat[data-treat]{opacity:1;}
  .cf-plate-treat[data-treat="fish"]::before{content:"🐟";}
  .cf-plate-treat[data-treat="milk"]::before{content:"🥛";}
  .cf-plate-treat[data-treat="chicken"]::before{content:"🍗";}
  .cf-plate-treat[data-treat="sushi"]::before{content:"🍣";}
  .cf-plate-treat[data-treat="cookie"]::before{content:"🍪";}

  #cf-cats{z-index:5;inset:0;pointer-events:none;}

  /* Cats are the only interactive thing in this layer (the button is the tap
     target for a cuddle, a later card). Facing (--dir) and the walk-bob (--bob,
     a per-frame value from the game clock) are transform-only, so step()
     positions stay exact and reduced motion simply drives --bob to 0. */
  .cf-cat{position:absolute;left:0;top:0;transform:translate(-50%,-50%);pointer-events:auto;
    padding:0;border:none;background:none;cursor:pointer;line-height:1;
    font-size:clamp(34px,10vmin,64px);min-width:56px;min-height:56px;display:grid;place-items:center;}
  .cf-cat-body{display:block;line-height:1;font-variant-emoji:emoji;
    transform:translateY(var(--bob,0)) scaleX(var(--dir,1));transform-origin:50% 50%;}
  .cf-cat-body::before{content:attr(data-e);}
  .cf-cat-acc{position:absolute;top:-0.32em;right:-0.24em;font-size:.55em;line-height:1;font-variant-emoji:emoji;}
  .cf-cat-acc::before{content:attr(data-e);}

  /* Gifts sit above the cats (z 6) so a leaving cat never blocks one; the fx
     layer (z 7) holds the flying gift and the sparkles, both unclickable. */
  #cf-gifts{z-index:6;inset:0;pointer-events:none;}
  .cf-gift{pointer-events:auto;position:absolute;left:0;top:0;transform:translate(-50%,-50%);
    width:clamp(72px,14vmin,104px);height:clamp(72px,14vmin,104px);padding:0;border:none;background:none;
    cursor:pointer;display:grid;place-items:center;line-height:1;
    font-size:clamp(40px,11vmin,72px);font-variant-emoji:emoji;animation:cf-gift-in .3s ease;}
  .cf-gift::before{content:attr(data-e);}
  /* Opacity-only entrance: the tap target is full size from the first frame
     (a scale-in would shrink it), and reduced motion keeps the same fade. */
  @keyframes cf-gift-in{from{opacity:0;}to{opacity:1;}}

  #cf-fx{z-index:7;inset:0;pointer-events:none;}
  .cf-fly,.cf-party{position:absolute;left:0;top:0;transform:translate(-50%,-50%);
    line-height:1;font-variant-emoji:emoji;pointer-events:none;}
  .cf-fly{font-size:clamp(36px,10vmin,64px);}
  .cf-party{font-size:clamp(22px,6vmin,40px);}
  .cf-fly::before,.cf-party::before{content:attr(data-e);}

  /* A decoration fades in once when it lands; opacity only, so reduced motion
     keeps it (the flight itself is what gets skipped). */
  .cf-decor-item{position:absolute;transform:translate(-50%,-50%);line-height:1;
    font-size:clamp(24px,7vmin,52px);font-variant-emoji:emoji;animation:cf-decor-in .4s ease;}
  .cf-decor-item::before{content:attr(data-e);}
  @keyframes cf-decor-in{from{opacity:0;}to{opacity:1;}}

  #cf-tray{z-index:8;left:50%;bottom:clamp(8px,2.6vmin,24px);transform:translateX(-50%);
    display:flex;align-items:center;gap:clamp(6px,1.8vmin,22px);padding:clamp(6px,1.4vmin,14px);
    border-radius:999px;background:rgba(255,255,255,.6);box-shadow:var(--shadow-soft);
    pointer-events:none;}
  .cf-treat{pointer-events:auto;touch-action:none;width:clamp(64px,11vmin,96px);aspect-ratio:1;padding:0;border:none;
    border-radius:50%;background:#fff;box-shadow:0 0.6vmin 0 rgba(74,63,107,.14);cursor:pointer;
    display:grid;place-items:center;line-height:1;
    transition:transform .16s ease, box-shadow .16s ease;}
  .cf-treat::before{font-size:clamp(30px,7vmin,60px);line-height:1;font-variant-emoji:emoji;}
  .cf-treat[data-treat="fish"]::before{content:"🐟";}
  .cf-treat[data-treat="milk"]::before{content:"🥛";}
  .cf-treat[data-treat="chicken"]::before{content:"🍗";}
  .cf-treat[data-treat="sushi"]::before{content:"🍣";}
  .cf-treat[data-treat="cookie"]::before{content:"🍪";}

  /* Picture-only feedback: a selected treat lifts, the tray or the treat bounces
     when a tap cannot do anything. No red, no text, no "wrong". */
  .cf-treat.cf-selected{transform:translateY(-8px) scale(1.08);
    box-shadow:0 0 0 3px var(--green), 0 1vmin 0 rgba(74,63,107,.14);}
  .cf-treat.cf-bounce{animation:cf-treat-bounce .35s ease 2;}
  #cf-tray.cf-hint{animation:cf-tray-hint .4s ease 3;}
  @keyframes cf-treat-bounce{
    0%,100%{transform:translateY(-8px) scale(1.08);}
    50%{transform:translateY(-16px) scale(1.12);}
  }
  @keyframes cf-tray-hint{
    0%,100%{transform:translateX(-50%) translateY(0);}
    50%{transform:translateX(-50%) translateY(-10px);}
  }

  /* CF-13 drag: touch-action:none lives on .cf-treat above so the browser
     never steals a finger drag (scroll/zoom -> pointercancel). The lifted
     ghost is an inert fixed clone with its OWN transition rules — the
     treat's .16s must not chase the finger; only the return glide
     transitions (.cf-return). The plate under the pointer lights up while
     the drop is valid; the dragged treat merely dims (D8). */
  .cf-treat.cf-dragging{opacity:.45;}
  .cf-plate.cf-over{transform:scale(1.14);
    filter:drop-shadow(0 0 1.4vmin rgba(255,214,90,.95));}
  .cf-ghost{position:fixed;z-index:60;pointer-events:none;transition:none;}
  .cf-ghost.cf-return{transition:transform .18s ease-out;}

  .cf-toggles{z-index:9;top:2.6vmin;right:2.6vmin;display:flex;gap:2.6vmin;pointer-events:none;}
  .cf-toggles button{pointer-events:auto;width:clamp(56px,8vmin,72px);aspect-ratio:1;padding:0;border:none;
    border-radius:50%;background:#fff;box-shadow:0 0.6vmin 0 rgba(74,63,107,.14);cursor:pointer;
    display:grid;place-items:center;font-size:clamp(26px,5.5vmin,44px);line-height:1;
    transition:transform .16s ease, box-shadow .16s ease;}
  #cf-daynight::before{content:"☀️";line-height:1;font-variant-emoji:emoji;}
  #app[data-time="night"] #cf-daynight::before{content:"🌙";}
  #cf-rain-btn::before{content:"🌧️";line-height:1;font-variant-emoji:emoji;}

  /* CF-15 friends book (PS §7, D3): a wordless gallery of the met cats only.
     The button sits bottom-left, clear of the tray (which is centred) and of
     the decor slots' safe band; the book is an overlay above every layer but
     the back button (TD §4 z-order), presented as a real modal dialog. */
  #cf-friends{z-index:9;left:clamp(8px,2.6vmin,24px);bottom:clamp(8px,2.6vmin,24px);
    width:clamp(56px,8vmin,72px);aspect-ratio:1;padding:0;border:none;border-radius:50%;
    background:#fff;box-shadow:0 0.6vmin 0 rgba(74,63,107,.14);cursor:pointer;
    display:grid;place-items:center;font-size:clamp(26px,5.5vmin,44px);line-height:1;
    font-variant-emoji:emoji;transition:transform .16s ease, box-shadow .16s ease;}
  #cf-friends::before{content:"📖";}
  /* Portrait is the one layout where the centred tray spans nearly the whole
     width (5 treats × 64 px), so the bottom-left 📖 would sit ON the first
     treat (verified 390×844: tray left 10, treat left 21). Lift the button
     clear of the tray row — still bottom-left, still ≥ 56 px, and it can
     never steal a treat tap (card regression risk). */
  @media (max-width:640px){
    #cf-friends{bottom:calc(clamp(8px,2.6vmin,24px) + 6.2rem);}
  }

  /* Hidden by the `hidden` ATTRIBUTE, not a class: the book must genuinely
     leave the layer stack when closed so it can never cover the tray's hit
     test (card regression risk). `[hidden]` alone loses to `display:grid`
     below, so the guard is stated explicitly. */
  #cf-book{z-index:30;inset:0;display:grid;place-items:center;
    background:rgba(255,255,255,.92);}
  #cf-book[hidden]{display:none;}
  .cf-book-grid{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
    gap:clamp(12px,3vmin,32px);padding:clamp(16px,5vmin,48px);
    max-width:min(92vw,88vh);max-height:min(92vw,88vh);}
  /* Met cats are buttons because a tap is a cuddle (CF-09): the same meow,
     the spoken name and hearts, on this page's own clock stamps. */
  .cf-book-cat{position:relative;pointer-events:auto;padding:0;border:none;background:#fff;
    cursor:pointer;width:clamp(72px,16vmin,120px);aspect-ratio:1;border-radius:50%;
    box-shadow:0 0.6vmin 0 rgba(74,63,107,.14);display:grid;place-items:center;
    font-size:clamp(38px,11vmin,68px);line-height:1;font-variant-emoji:emoji;
    transition:transform .16s ease, box-shadow .16s ease;}
  .cf-book-cat-body{display:block;line-height:1;font-variant-emoji:emoji;}
  .cf-book-cat-body::before{content:attr(data-e);}
  .cf-book-cat-acc{position:absolute;top:0.22em;right:0.22em;font-size:.5em;line-height:1;font-variant-emoji:emoji;}
  .cf-book-cat-acc::before{content:attr(data-e);}
  /* Empty book: a single 🐾, decorative and unclickable (PS §7). */
  .cf-book-empty{width:clamp(72px,16vmin,120px);aspect-ratio:1;display:grid;place-items:center;
    font-size:clamp(38px,11vmin,68px);line-height:1;font-variant-emoji:emoji;pointer-events:none;}
  .cf-book-empty::before{content:"🐾";}
  #cf-book-close{position:absolute;top:2.6vmin;right:2.6vmin;pointer-events:auto;
    width:clamp(72px,9vmin,88px);aspect-ratio:1;padding:0;border:none;border-radius:50%;
    background:#fff;box-shadow:0 0.6vmin 0 rgba(74,63,107,.14);cursor:pointer;
    display:grid;place-items:center;font-size:clamp(30px,6vmin,48px);line-height:1;
    font-variant-emoji:emoji;transition:transform .16s ease, box-shadow .16s ease;}
  #cf-book-close::before{content:"✖️";}

  /* The keyboard/OS preference always wins over the page's own motion.
     CF-12 audit (TP §3.10): every decorative *movement* is disabled here —
     press feedback and the idle pulse (DECISIONS: shake/pulse suppressed) and
     the rain fall (card step 2). The two opacity-only entrance fades above are
     DELIBERATELY kept running: their keyframes touch opacity alone, which is     their exemption and is asserted by the smoke. */
  @media (prefers-reduced-motion: reduce){
    .cf-plate,.cf-treat,.cf-toggles button{transition:none;}
    #cf-friends,#cf-book-close,.cf-book-cat{transition:none;}
    #cf-sky-night,#cf-night-tint,#cf-stars{transition:none;}
    #cf-rain i{animation:none;transform:translateY(var(--y));opacity:.3;}
    .cf-treat.cf-bounce,#cf-tray.cf-hint{animation:none;}
  }

  /* Desktop tier, mirroring sorting.html: cap the vmin glyphs so a tablet held
     in landscape does not turn the forest into giant emoji. */
  @media (min-width:800px) and (min-height:600px){
    .cf-plate::before{font-size:88px;}
    .cf-treat::before{font-size:60px;}
    .cf-toggles button{font-size:44px;}
    #cf-friends{font-size:44px;}
    #cf-book-close{font-size:48px;}
    .cf-book-cat,.cf-book-empty{font-size:68px;}
    .cf-tree{font-size:110px;}
    .cf-tree-2{font-size:92px;}
    .cf-tree-3{font-size:74px;}
  }
</style>
</head>
<body>
<div id="app" class="cf-app" data-time="day" data-weather="clear">
  <button class="back-btn ps-back" id="cat-forest-back" aria-label="Назад"><svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
  <div id="cf-stage">
    <div class="cf-sky" aria-hidden="true"></div>
    <div id="cf-sky-night" aria-hidden="true"></div>
    <div id="cf-scenery" aria-hidden="true">
      <span class="cf-hill cf-hill-1"></span>
      <span class="cf-hill cf-hill-2"></span>
      <span class="cf-tree cf-tree-1"></span>
      <span class="cf-tree cf-tree-2"></span>
      <span class="cf-tree cf-tree-3"></span>
    </div>
    <div id="cf-decor" aria-hidden="true"></div>
    <div id="cf-night-tint" aria-hidden="true"></div>
    <div id="cf-stars" aria-hidden="true">
      <span class="cf-star cf-star-1"></span>
      <span class="cf-star cf-star-2"></span>
      <span class="cf-star cf-star-3"></span>
    </div>
    <div id="cf-plates">
      <button class="cf-plate" data-plate="0" aria-label="Тањир"><span class="cf-plate-treat"></span></button>
      <button class="cf-plate" data-plate="1" aria-label="Тањир"><span class="cf-plate-treat"></span></button>
      <button class="cf-plate" data-plate="2" aria-label="Тањир"><span class="cf-plate-treat"></span></button>
    </div>
    <div id="cf-cats"></div>
    <div id="cf-gifts"></div>
    <div id="cf-fx" aria-hidden="true"></div>
    <div id="cf-rain" aria-hidden="true"></div>
    <div id="cf-tray">
      <button class="cf-treat" data-treat="fish" aria-label="Риба" aria-pressed="false"></button>
      <button class="cf-treat" data-treat="milk" aria-label="Млеко" aria-pressed="false"></button>
      <button class="cf-treat" data-treat="chicken" aria-label="Пилетина" aria-pressed="false"></button>
      <button class="cf-treat" data-treat="sushi" aria-label="Суши" aria-pressed="false"></button>
      <button class="cf-treat" data-treat="cookie" aria-label="Колачић" aria-pressed="false"></button>
    </div>
    <div class="cf-toggles">
      <button id="cf-daynight" aria-pressed="false" aria-label="Дан и ноћ"></button>
      <button id="cf-rain-btn" aria-pressed="false" aria-label="Киша"></button>
    </div>
    <button id="cf-friends" aria-label="Мачке пријатељи"></button>
    <div id="cf-book" role="dialog" aria-modal="true" aria-label="Мачке пријатељи" hidden>
      <button id="cf-book-close" aria-label="Затвори"></button>
      <div class="cf-book-grid"><span class="cf-book-empty"></span></div>
    </div>
  </div>
</div>
