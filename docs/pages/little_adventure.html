<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#4A3F6B">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Мала авантура — Петрин свет</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏝️</text></svg>">
    <link rel="stylesheet" href="../styles/viewport.css">
    <link rel="stylesheet" href="../styles/design-tokens.css">
    <link rel="stylesheet" href="../shared/accessibility.css">
    <link rel="stylesheet" href="../styles/components.css">
    <style>
        @font-face {
            font-family: 'Fredoka';
            font-style: normal;
            font-weight: 100 700;
            font-display: swap;
            src: url('../assets/fonts/fredoka-latin.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
            font-family: 'Fredoka';
            font-style: normal;
            font-weight: 100 700;
            font-display: swap;
            src: url('../assets/fonts/fredoka-latin-ext.woff2') format('woff2');
            unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Fredoka', 'Comic Sans MS', cursive, sans-serif; }
        #i3d-game { position: fixed; inset: 0; overflow: hidden; background: #87CEEB; }
        #i3d-view { position: absolute; inset: 0; }
        #i3d-view canvas { width: 100%; height: 100%; display: block; }
        #i3d-vignette { position: absolute; inset: 0; pointer-events: none; z-index: 15; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.12) 100%); }
        /* --- Back button --- */
        #i3d-back {
            position: absolute; bottom: 4vmin; left: 4vmin; z-index: 30;
        }
        /* --- Screen-reader live region --- */
        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
        }
        /* --- Landscape lock hint (portrait tablets) --- */
        #i3d-landscape-hint {
            display: none; position: absolute; inset: 0; z-index: 40;
            background: rgba(74, 63, 107, 0.92); color: #FFF8ED;
            align-items: center; justify-content: center; text-align: center;
            font-size: 26px; font-weight: 700; padding: 6vmin;
            animation: i3d-hint-pulse 2.2s ease-in-out infinite;
        }
        @keyframes i3d-hint-pulse { 0%,100% { opacity: 0.92; transform: scale(1); } 50% { opacity: 1; transform: scale(1.02); } }
        @media (prefers-reduced-motion: reduce) { #i3d-landscape-hint { animation: none; } }
        @media (orientation: portrait) and (min-width: 520px) {
            #i3d-landscape-hint { display: flex; }
        }
    </style>
</head>
<body>
<div id="i3d-game">
    <button class="adv-back ps-back" id="i3d-back" aria-label="Назад"><svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
    <div id="i3d-view"></div>
    <div id="i3d-vignette"></div>
    <div id="i3d-stick-zone" style="position:absolute; left:0; top:0; width:50%; height:100%; z-index:5; touch-action:none;"></div>
    <div id="i3d-stick-base" style="position:absolute; display:none; width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,0.25); border:2px solid rgba(255,255,255,0.5); transform:translate(-50%,-50%); z-index:6; pointer-events:none;"></div>
    <div id="i3d-stick-knob" style="position:absolute; display:none; width:50px; height:50px; border-radius:50%; background:rgba(74,63,107,0.7); transform:translate(-50%,-50%); z-index:7; pointer-events:none;"></div>
    <button id="i3d-btn-sword" class="ps-btn ps-btn--control" aria-label="Мач" style="position:absolute; right:4vmin; bottom:18vmin; width:16vmin; height:16vmin; z-index:20;"><svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path fill="currentColor" d="M6.9 20.8l-3.7-3.7 11.3-11.3 1.4 1.4-9 9 2.3 2.3 9-9 1.4 1.4-11.3 11.3-1.4-1.4zM18 4l2 2-2 2-2-2 2-2z"/></svg></button>
    <button id="i3d-btn-shield" class="ps-btn ps-btn--control" aria-label="Штит" style="position:absolute; right:4vmin; bottom:4vmin; width:14vmin; height:14vmin; z-index:20;"><svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path fill="currentColor" d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg></button>
    <button id="i3d-sound-btn" class="ps-btn ps-btn--control" aria-label="Звук" aria-pressed="true" style="position:absolute; top:2vmin; right:4vmin; width:10vmin; height:10vmin; z-index:30;"><svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0014 8.97v6.02A4.47 4.47 0 0016.5 12zM14 3.23v2.06a6.5 6.5 0 010 13.42v2.06a8.5 8.5 0 000-17.54z"/></svg></button>
    <div id="i3d-landscape-hint">Окрени уређај водоравно 🌍</div>
    <div id="i3d-pause" style="position:absolute; inset:0; z-index:45; display:none; align-items:center; justify-content:center; flex-direction:column; gap:2vmin; background:rgba(0,0,0,0.45); color:#FFF8ED; font-size:6vmin; pointer-events:auto; text-shadow:0 2px 8px rgba(0,0,0,0.4);"><svg viewBox="0 0 24 24" width="10vmin" height="10vmin" aria-hidden="true" style="fill:#FFF8ED;"><rect x="5" y="4" width="4" height="16" rx="1"/><rect x="13" y="4" width="4" height="16" rx="1"/></svg><div style="font-size:4vmin;">Пауза</div></div>
    <div id="i3d-drag-hint" style="display:none; position:absolute; left:8vmin; bottom:22vmin; z-index:25; padding:1.5vmin 2.5vmin; border-radius:2vmin; background:rgba(74,63,107,0.72); color:#FFF8ED; font-size:3.2vmin; pointer-events:none;">Превуци да се крећеш</div>
    <div id="i3d-start" style="position:absolute; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; background:linear-gradient(180deg, rgba(74,63,107,0.18) 0%, rgba(74,63,107,0.55) 55%, rgba(74,63,107,0.78) 100%); color:#FFF8ED; pointer-events:none; text-shadow:0 2px 8px rgba(0,0,0,0.35);">
      <h1 style="font-size:8vmin; margin:0 0 4vmin;">Мала авантура</h1>
      <button id="i3d-btn-continue" class="ps-btn ps-btn--control" aria-label="Настави" style="display:none; margin:2vmin; min-width:28vmin; height:10vmin; pointer-events:auto; font-size:4vmin; gap:1vmin;"><svg viewBox="0 0 24 24" width="1.2em" height="1.2em" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg><span>Настави</span></button>
      <button id="i3d-btn-new" class="ps-btn ps-btn--control" aria-label="Нова авантура" style="margin:2vmin; min-width:28vmin; height:10vmin; pointer-events:auto; font-size:4vmin; gap:1vmin;"><svg viewBox="0 0 24 24" width="1.2em" height="1.2em" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.96 7.96 0 0012 4a8 8 0 108 8h-2a6 6 0 11-1.76-4.24L14 10h6V4l-2.35 2.35z"/></svg><span>Нова</span></button>
    </div>
</div>
