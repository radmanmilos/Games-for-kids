<title>Редослед — Петрин свет</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📆</text></svg>">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;background:var(--cream);font-family:Fredoka,sans-serif;color:var(--plum)}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vmin;padding:4vmin}
.back-btn{position:absolute;top:2.6vmin;left:2.6vmin;z-index:20}
#seq-prompt{font-size:5.2vmin;font-weight:700;text-align:center}
.seq-slots{display:flex;gap:3vmin;justify-content:center;align-items:center}
/* V16 (spec §34/§42.18): the dashed white placeholder box becomes a calm
   recessed slot that reads as a destination to drop into — solid soft border,
   warm cream basin fill, and an inset shadow. The piece<->slot relation stays
   the primary signal (pieces keep their strong lifted shadow). */
.seq-slot{width:20vmin;height:20vmin;border:2px solid rgba(74,63,107,.16);border-radius:22px;background:linear-gradient(#FBF1E0 0%, #F4E7D2 100%);box-shadow:inset 0 .9vmin 1.8vmin rgba(74,63,107,.14);display:flex;align-items:center;justify-content:center;transition:border-color .12s ease, background .12s ease}
.seq-slot-num{font-size:4.4vmin;font-weight:700;color:rgba(74,63,107,.35)}
.seq-slot.seq-over{border-color:var(--green);background:#f1fff1;box-shadow:inset 0 .9vmin 1.8vmin rgba(103,201,113,.22)}
.seq-slot.seq-filled{border-color:rgba(103,201,113,.5);background:#f6fff6;box-shadow:inset 0 .5vmin 1.2vmin rgba(103,201,113,.12)}
/* Soft paper tray: a gently recessed mat where the loose pieces wait. */
.seq-tray{display:flex;gap:3vmin;justify-content:center;align-items:center;min-height:20vmin;padding:2.4vmin;border-radius:26px;border:2px solid rgba(74,63,107,.12);background:linear-gradient(#FFFDF7 0%, #FBF1E0 100%);box-shadow:inset 0 .6vmin 1.6vmin rgba(74,63,107,.08), 0 1vmin 0 rgba(74,63,107,.06)}
.seq-card{width:17vmin;height:17vmin;border:none;border-radius:18px;background:linear-gradient(#FFFFFF 0%, #FEF9F0 100%);box-shadow:0 1.2vmin 0 rgba(74,63,107,.14), 0 1.6vmin 2.6vmin rgba(74,63,107,.08);display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;transition:box-shadow .12s ease}
.seq-card:active{cursor:grabbing}
.seq-card.seq-dragging{z-index:50}
.seq-emoji{font-size:9vmin;line-height:1}
/* Clearer placement feedback: the piece settles with a small pop, a wrong drop
   gives a gentle shake (never red/punishment), and completion softly pulses. */
.seq-card.seq-placed{animation:seq-settle .34s ease}
.seq-card.seq-wrong{animation:seq-shake .4s ease}
.seq-slots.seq-complete .seq-slot{border-color:rgba(103,201,113,.6);animation:seq-complete-pulse .9s ease-in-out 1}
#seq-feedback{min-height:6vmin;font-size:4vmin;font-weight:600;color:var(--green);text-align:center}
@keyframes seq-settle{0%{transform:scale(1.08)}60%{transform:scale(.98)}100%{transform:scale(1)}}
@keyframes seq-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.2vmin)}75%{transform:translateX(1.2vmin)}}
@keyframes seq-complete-pulse{0%,100%{box-shadow:inset 0 .9vmin 1.8vmin rgba(103,201,113,.16)}50%{box-shadow:inset 0 .9vmin 1.8vmin rgba(103,201,113,.32), 0 0 0 1vmin rgba(103,201,113,.12)}}
@media (prefers-reduced-motion: reduce){.seq-card.seq-placed,.seq-card.seq-wrong,.seq-slots.seq-complete .seq-slot{animation:none}}
/* Desktop sizes need desktop HEIGHT too: an 844x390 short-landscape window is
   800px+ wide but only 390 tall (the same trap V3.1 found on sorting). */
@media (min-width:800px) and (min-height:600px){#seq-prompt{font-size:40px}.seq-slot{width:150px;height:150px}.seq-card{width:128px;height:128px}.seq-emoji{font-size:72px}#seq-feedback{font-size:30px}}
/* Short landscape (844x390): fixed desktop sizes would crowd the fold, so keep
   moderate pieces that leave the whole tray, pieces and feedback visible. */
@media (min-width:800px) and (max-height:599px){#seq-prompt{font-size:26px}.seq-slot{width:132px;height:132px}.seq-card{width:112px;height:112px}.seq-emoji{font-size:62px}#seq-feedback{font-size:22px}}
</style>
</head>
<body>
<div id="app">
  <button class="back-btn ps-back" id="seq-back" aria-label="Назад"><svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
  <div id="seq-prompt" class="learn-instruction">Постави у редослед!</div>
  <div class="seq-slots learn-stage-mat" id="seq-slots"></div>
  <div class="seq-tray learn-answers" id="seq-tray"></div>
  <div id="seq-feedback" class="learn-feedback" aria-live="polite"></div>
</div>

</body>
</html>
