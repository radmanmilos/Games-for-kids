<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#4A3F6B">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Редослед — Петрин свет</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📆</text></svg>">
<link rel="stylesheet" href="../styles/viewport.css">
<link rel="stylesheet" href="../styles/design-tokens.css">
<link rel="shared/accessibility.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;background:var(--cream);font-family:Fredoka,sans-serif;color:var(--plum)}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vmin;padding:4vmin}
.back-btn{position:absolute;top:2.6vmin;left:2.6vmin;width:11vmin;height:11vmin;border-radius:50%;border:none;background:var(--plum);color:#fff;font-size:5vmin;display:flex;align-items:center;justify-content:center;box-shadow:0 1vmin 0 rgba(0,0,0,.2);z-index:20}
.back-btn:active{transform:scale(.92) translateY(3px)}
#seq-prompt{font-size:5.2vmin;font-weight:800;text-align:center}
.seq-slots{display:flex;gap:3vmin;justify-content:center;align-items:center}
.seq-slot{width:18vmin;height:18vmin;border:3px dashed rgba(74,63,107,.25);border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1.2vmin 0 rgba(0,0,0,.08)}
.seq-slot.seq-over{border-color:var(--green);background:#f1fff1}
.seq-tray{display:flex;gap:3vmin;justify-content:center;align-items:center;min-height:20vmin;padding:2vmin;border-radius:20px;background:rgba(74,63,107,.05)}
.seq-card{width:16vmin;height:16vmin;border:none;border-radius:14px;background:#fff;box-shadow:0 1.2vmin 0 rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.seq-card:active{cursor:grabbing}
.seq-card.seq-dragging{z-index:50}
.seq-emoji{font-size:9vmin;line-height:1}
#seq-feedback{min-height:6vmin;font-size:4vmin;font-weight:700;color:var(--green);text-align:center}
@media (min-width:800px){#seq-prompt{font-size:40px}.seq-slot{width:140px;height:140px}.seq-card{width:120px;height:120px}.seq-emoji{font-size:68px}}
</style>
</head>
<body>
<div id="app">
  <button class="back-btn" id="seq-back" aria-label="Назад"><svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
  <div id="seq-prompt">Постави у редослед!</div>
  <div class="seq-slots" id="seq-slots"></div>
  <div class="seq-tray" id="seq-tray"></div>
  <div id="seq-feedback" aria-live="polite"></div>
</div>
<script src="../data/serbian.js"></script>
<script src="../shared/navigation.js"></script>
<script src="../shared/celebration.js"></script>
<script src="../shared/audio.js"></script>
<script src="../shared/speech.js"></script>
<script src="../shared/utils.js"></script>
<script src="../games/sequencing.js"></script>
<script src="../shared/audio-buses.js"></script>
<script src="../shared/viewport.js"></script>
<script src="../shared/input.js"></script>
<script src="../shared/feedback.js"></script>
<script src="../shared/motion.js"></script>
<script src="../data/app-registry.js"></script>
<script src="../shared/main.js"></script>
</body>
</html>
