<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#4A3F6B">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Бројање животиња — Петрин свет</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔢</text></svg>">
<link rel="stylesheet" href="../styles/viewport.css">
    <link rel="stylesheet" href="../styles/design-tokens.css">
  <link rel="stylesheet" href="../styles/learning-stage.css">
    <link rel="stylesheet" href="../shared/accessibility.css">
    <link rel="stylesheet" href="../styles/components.css">
<style>
:root{ --cream:#FFF8ED; --sky:#4FC3F7; --sky-deep:#2FA6DA; --yellow:#FFD23F; --green:#67C971; --pink:#FF6F91; --plum:#4A3F6B; --plum-soft:#655A8C; }
body{font-family:Fredoka, sans-serif;background:var(--cream);margin:0;height:100vh;color:var(--plum)}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.back-btn{position:absolute;top:4vmin;left:4vmin;width:12vmin;height:12vmin;border-radius:50%;border:none;background:var(--plum);color:white;font-size:6vmin;display:flex;align-items:center;justify-content:center;box-shadow:0 1vmin 0 rgba(0,0,0,.2);}
.candy-score{position:absolute;top:2vmin;right:4vmin;z-index:30;background:var(--plum);color:#fff;font-size:4vmin;font-weight:700;padding:1.2vmin 3.4vmin;border-radius:999px;box-shadow:0 1vmin 0 rgba(0,0,0,.2)}
</style>
</head>
<body>
<div id="app"></div>
<script src="../data/serbian.js"></script>
<script src="../shared/navigation.js"></script>
<script src="../shared/celebration.js"></script>
<script src="../shared/audio.js"></script>
<script src="../shared/audio-buses.js"></script>
<script src="../shared/speech.js"></script>
<script src="../shared/utils.js"></script>
<script src="../games/animal_counting.js"></script>
<script>document.addEventListener('DOMContentLoaded', ()=>{ if(typeof startAnimalCounting==='function') startAnimalCounting(); });</script>
<style>
  /* V11 composition: fill the viewport, enlarge the stage, keep the prompt close
     to the stage, and guarantee comfortable choices that never overflow. */
  #game-counting{width:100%;height:100%}
  .count-stage-wrap{box-sizing:border-box;width:min(100%,46rem);margin:0 auto;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(6px,1.6vmin,14px);padding:clamp(4.4rem,9vmin,5.6rem) 3vmin 2.4vmin}
  .count-head{display:flex;gap:12px;align-items:center;justify-content:center}
  .count-title{margin:0;font-size:clamp(20px,5.6vmin,32px)}
  .count-info{color:var(--plum-soft);font-weight:600;font-size:clamp(14px,3.6vmin,20px)}
  /* the counting stage: full width, tiles wrap inside it, roomy and centered */
  .count-scene{box-sizing:border-box;width:100%;min-height:clamp(110px,26vmin,220px);
    display:flex;flex-wrap:wrap;align-content:center;justify-content:center;
    gap:clamp(6px,1.6vmin,12px);padding:clamp(8px,2vmin,16px);border-radius:16px;
    background:rgba(255,255,255,0.95);box-shadow:0 2vmin 4vmin rgba(0,0,0,.08)}
  /* animal tile visuals follow matching_game color patterns */
  .count-scene .count-tile{display:flex;align-items:center;justify-content:center;
    width:clamp(52px,15vmin,104px);height:clamp(52px,15vmin,104px);border-radius:12px;
    background:linear-gradient(#fff,#fff);box-shadow:0 1.2vmin 0 rgba(0,0,0,.06);
    font-size:clamp(28px,8.4vmin,58px);cursor:pointer;transition:transform .15s ease}
  .count-scene .count-tile.counted{transform:scale(0.85);opacity:0.6;box-shadow:0 0 0 3px var(--green)}
  .count-scene .count-tile[data-animal="Dog"]{background:radial-gradient(circle at 35% 30%, #FFF3B0, #FFD23F 55%, #FFB800);}
  .count-scene .count-tile[data-animal="Cat"]{background:radial-gradient(circle at 35% 30%, #FFB6D0,#FF7FA8);}
  .count-scene .count-tile[data-animal="Cow"]{background:radial-gradient(circle at 35% 30%, #C9A6FF, #9B6DFF);}
  .count-scene .count-tile[data-animal="Pig"]{background:radial-gradient(circle at 35% 30%, #FFD6E6, #FF9FB6);}
  .count-scene .count-tile[data-animal="Fox"]{background:radial-gradient(circle at 35% 30%, #FFD8B0, #FFB56A);}
  .count-scene .count-tile[data-animal="Frog"]{background:radial-gradient(circle at 35% 30%, #CFFFD6, #67C971);}

  .count-buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(8px,2.2vmin,16px)}
  /* number choice tiles — large, comfortable, always at/above the 64px touch floor */
  .count-choice{min-width:clamp(64px,15vmin,84px);min-height:clamp(64px,15vmin,84px);border-radius:16px;
    background:var(--yellow);color:var(--plum);font-weight:800;border:3px solid rgba(74,63,107,.12);
    box-shadow:0 1.2vmin 0 rgba(0,0,0,.06);font-size:clamp(24px,5vmin,34px)}
  .count-choice:active{transform:translateY(4px)}
  .count-choice.correct{transform:scale(1.06);box-shadow:0 1.6vmin 0 rgba(0,0,0,.08);border:4px solid rgba(74,63,107,.16)}

  /* NEXT button style matches animals.html next-btn */
  .next-btn{width:clamp(64px,13vmin,84px);height:clamp(64px,13vmin,84px);border-radius:50%;border:none;
    background:var(--yellow);color:var(--plum);font-size:clamp(30px,6.4vmin,42px);display:flex;align-items:center;justify-content:center;box-shadow:0 1vmin 0 rgba(0,0,0,.15);z-index:20;}

  .count-result{color:var(--plum);font-weight:800;font-size:clamp(16px,4.2vmin,26px);min-height:1.5em;text-align:center}
  .collected{transform:scale(1.12);transition:transform .14s ease}
  .floating-plus{position:relative;left:8px;font-weight:800;color:var(--yellow);text-shadow:0 2px 0 rgba(0,0,0,.14);opacity:0}
  .floating-plus.float{transform:translateY(-30px);opacity:1;transition:all .85s cubic-bezier(.2,.8,.2,1)}
  /* short landscape (844x390): shrink so 10 tiles + 10 choices + feedback all fit */
  @media (max-height:520px){
    .count-stage-wrap{padding:clamp(3.2rem,13vmin,4rem) 3vmin 1.4vmin;gap:clamp(3px,0.9vmin,8px)}
    .count-title{font-size:clamp(16px,4.4vmin,22px)}
    .count-info{font-size:clamp(12px,3vmin,16px)}
    .count-scene{min-height:0;padding:clamp(6px,1.4vmin,10px)}
    .count-scene .count-tile{width:clamp(40px,11vmin,64px);height:clamp(40px,11vmin,64px);font-size:clamp(22px,6.4vmin,34px)}
    .count-choice{min-width:64px;min-height:64px;font-size:clamp(20px,4.6vmin,26px)}
    .next-btn{width:clamp(52px,11vmin,64px);height:clamp(52px,11vmin,64px);font-size:clamp(26px,6vmin,34px)}
    .count-result{font-size:clamp(14px,3.6vmin,20px)}
  }
  /* celebrate animation — overlay so it never affects layout (esp. 844x390) */
    .celebrate{ pointer-events:none; }
    #countCelebrate{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:none; z-index:25; font-size:14vmin; align-items:center; justify-content:center; }
    .celebrate.show{ animation: pop .6s ease; display:flex; }
    @keyframes pop{ 0%{ transform:translate(-50%,-50%) scale(0); opacity:0; } 60%{ transform:translate(-50%,-50%) scale(1.2); opacity:1; } 100%{ transform:translate(-50%,-50%) scale(1); opacity:1; } }

</style>
</body>
</html>
