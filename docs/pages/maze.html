<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4A3F6B" />
  <title>Путања — Петрин свет</title>
  <link rel="manifest" href="../manifest.json" />
  <link rel="stylesheet" href="../styles/viewport.css" />
  <link rel="stylesheet" href="../styles/design-tokens.css" />
  <link rel="stylesheet" href="../shared/accessibility.css" />
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
    html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;background:var(--cream);font-family:Fredoka,sans-serif;color:var(--plum)}
    #app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vmin;padding:3vmin}
    .back-btn{position:absolute;top:2.6vmin;left:2.6vmin;width:11vmin;height:11vmin;border-radius:50%;border:none;background:var(--plum);color:#fff;font-size:5vmin;display:flex;align-items:center;justify-content:center;box-shadow:0 1vmin 0 rgba(0,0,0,.2);z-index:20}
    #maze-prompt{font-size:5.6vmin;font-weight:800;text-align:center}

    /* The board keeps the maze's own aspect ratio, so a stone is square and the
       path never distorts between a phone and a desktop. */
    #maze-stage{
      position:relative;
      width:min(88vmin,460px);
      aspect-ratio:6/4;
      border-radius:4vmin;
      border:0.5vmin solid #fff;
      box-shadow:0 1vmin 0 rgba(0,0,0,.08);
      overflow:hidden;
      touch-action:none;
    }
    .maze-ground{position:absolute;inset:0;background:#e6f4e2}
    .maze-stone{position:absolute;display:flex;align-items:center;justify-content:center;background:#f6e2b4;border-radius:28%;transition:background .2s ease}
    .maze-stone.maze-done{background:#cdead2}
    .maze-mark{font-size:min(9vmin,46px);line-height:1}
    .maze-token{
      position:absolute;
      transform:translate(-50%,-50%);
      display:flex;align-items:center;justify-content:center;
      padding:0;margin:0;border:none;background:transparent;
      font-size:min(11vmin,58px);line-height:1;
      cursor:grab;touch-action:none;
      transition:left .22s ease,top .22s ease;
      z-index:3;
    }
    .maze-token.maze-dragging{cursor:grabbing;transition:none}
    @media (prefers-reduced-motion: reduce){.maze-stone,.maze-token{transition:none}.maze-token.maze-dragging{transition:none}}

    .retry-btn{position:absolute;top:2.6vmin;right:2.6vmin;width:11vmin;height:11vmin;border-radius:50%;border:none;background:var(--sky);color:var(--plum);font-size:5vmin;display:flex;align-items:center;justify-content:center;box-shadow:0 1vmin 0 rgba(0,0,0,.15);cursor:pointer}
    #maze-feedback{min-height:6vmin;font-size:4.4vmin;font-weight:700;color:var(--green);text-align:center}
    @media (min-width:800px){#maze-prompt{font-size:36px}.maze-mark{font-size:34px}.maze-token{font-size:44px}#maze-feedback{font-size:28px}}
  </style>
</head>
<body>
  <div id="app">
    <button class="back-btn" id="maze-back" aria-label="Назад">←</button>
    <div class="retry-btn-wrap">
      <button class="retry-btn" id="maze-retry" aria-label="Почни поново">🔄</button>
    </div>
    <div id="maze-prompt">Пронађи пут до куће</div>
    <div id="maze-board">
      <div id="maze-stage"></div>
    </div>
    <div id="maze-feedback" aria-live="polite"></div>
  </div>
  <script src="../data/serbian.js"></script>
  <script src="../shared/navigation.js"></script>
  <script src="../shared/celebration.js"></script>
  <script src="../shared/audio.js"></script>
  <script src="../shared/speech.js"></script>
  <script src="../shared/utils.js"></script>
  <script src="../games/maze.js"></script>
  <script src="../shared/audio-buses.js"></script>
  <script src="../shared/viewport.js"></script>
  <script src="../shared/input.js"></script>
  <script src="../shared/feedback.js"></script>
  <script src="../shared/motion.js"></script>
  <script src="../data/app-registry.js"></script>
  <script src="../shared/main.js"></script>
</body>
</html>
